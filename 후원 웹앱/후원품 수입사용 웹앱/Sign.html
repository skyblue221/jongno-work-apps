<!DOCTYPE html>
<html lang="ko">
<head>
<base target="_top">
<meta charset="utf-8">
<style>
@import url("https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap");
/* 후원품 수입사용 — 대표 색: 남색 (관리 화면과 맞춤) */
:root{--bg:#f6f4ef;--ink:#1f2421;--sub:#5b625e;--line:#d6d2c8;--rule:#1f2421;--pri:#1f3a5f;--pri-dark:#152a46;--pri2:#f5eedd;--warn:#a8322a;--warnbg:#fbefed}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 "Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;word-break:keep-all}

/* 머리말: 색 띠 대신 서식지처럼 왼쪽 정렬 + 굵은 밑줄 */
header{max-width:520px;margin:0 auto;padding:24px 16px 0}
header::before{content:"종로장애인복지관";display:block;margin-bottom:4px;color:var(--pri);font-size:14px;font-weight:700}
header h1{margin:0;padding-bottom:14px;border-bottom:2px solid var(--rule);font-size:24px;font-weight:700;letter-spacing:-.02em}

main{max-width:520px;margin:0 auto;padding:18px 16px 40px}
.card{background:#fff;border:1px solid var(--line);border-radius:6px;padding:20px 18px;margin-bottom:14px}
h2{font-size:19px;margin:0 0 10px;font-weight:700}
p{margin:0 0 10px}

/* 본인확인 번호칸 */
input{width:100%;min-height:56px;padding:12px;border:1px solid var(--line);border-radius:4px;font:inherit;font-size:22px;letter-spacing:6px;text-align:center;background:#fff}
input:focus{border-color:var(--pri);outline:2px solid var(--pri);outline-offset:1px}

.btn{display:block;width:100%;min-height:54px;border:0;border-radius:4px;padding:14px;font:inherit;font-weight:700;background:var(--pri);color:#fff;margin-top:12px;cursor:pointer}
.btn:hover:not(:disabled){background:var(--pri-dark)}
.btn.line{background:#fff;border:1px solid var(--line);color:var(--ink)}
.btn.line:hover{border-color:var(--ink)}
.btn:disabled{opacity:.6;cursor:not-allowed}

/* 안내 상자: 색 박스 대신 왼쪽 줄 */
.warn{background:var(--warnbg);color:var(--warn);border-left:3px solid var(--warn);padding:12px 14px;margin-top:10px}
.ok{background:var(--pri2);color:var(--pri-dark);border-left:3px solid var(--pri);padding:16px}

/* 물품 목록: 수령증 표처럼 */
table{width:100%;border-collapse:collapse;margin:8px 0 10px;border-top:2px solid var(--rule)}
td{border-bottom:1px solid var(--line);padding:10px 4px}
td:last-child{text-align:right;font-weight:700;white-space:nowrap}

/* 서명란: 종이 서명칸처럼 밑줄 */
#pad{display:block;width:100%;height:220px;border:1px solid var(--rule);border-radius:4px;touch-action:none;
  background:linear-gradient(var(--line),var(--line)) left 20px bottom 46px/calc(100% - 40px) 1px no-repeat,#fff}
.muted{color:var(--sub);font-size:15px}
</style>
</head>
<body>
<header><h1>후원품 수령 확인</h1></header>
<main><div class="card" id="box">확인하는 중이에요...</div></main>
<script>
/** 서명 저장: 빈 공간을 잘라내고(여백 조금) 저장해서 수령증 칸에 크게·진하게 보이게 */
function sigCrop(cv){
  const W=cv.width,H=cv.height,d=cv.getContext('2d').getImageData(0,0,W,H).data;
  let x0=W,y0=H,x1=-1,y1=-1;
  for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(d[(y*W+x)*4+3]>20){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y;}
  if(x1<0)return cv.toDataURL('image/png');
  const pad=Math.round(Math.max(W,H)*0.03);x0=Math.max(0,x0-pad);y0=Math.max(0,y0-pad);x1=Math.min(W-1,x1+pad);y1=Math.min(H-1,y1+pad);
  const bw=x1-x0+1,bh=y1-y0+1,s=Math.min(1,900/Math.max(bw,bh)),o=document.createElement('canvas');
  o.width=Math.max(1,Math.round(bw*s));o.height=Math.max(1,Math.round(bh*s));o.getContext('2d').drawImage(cv,x0,y0,bw,bh,0,0,o.width,o.height);
  return o.toDataURL('image/png');
}

const $=s=>document.querySelector(s);
const esc=v=>String(v==null?'':v).replace(/[&\x3c>"']/g,c=>({'&':'&amp;','\x3c':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const call=(fn,...a)=>new Promise((res,rej)=>google.script.run.withSuccessHandler(res).withFailureHandler(e=>rej(e&&e.message?e.message:e))[fn](...a));
let TOKEN='', CODE='';
function fail(msg){ $('#box').innerHTML=`\x3ch2>링크를 열 수 없어요\x3c/h2>\x3cp>${esc(msg)}\x3c/p>`; }

google.script.url.getLocation(l=>{
  TOKEN=(l&&l.parameter&&l.parameter.s)||'';
  call('publicSignInfo',TOKEN).then(first).catch(fail);
});

function first(info){
  $('#box').innerHTML=`\x3ch2>${esc(info.name)}님, 안녕하세요\x3c/h2>
    \x3cp>보내드린 후원품을 받으셨는지 확인하는 화면이에요. 먼저 본인 확인을 해 주세요.\x3c/p>
    \x3cp class="muted">${esc(info.check)}\x3c/p>
    \x3cinput id="code" inputmode="numeric" maxlength="8" autocomplete="off">
    \x3cbutton class="btn" id="go">확인\x3c/button>\x3cdiv id="msg">\x3c/div>`;
  $('#go').onclick=async e=>{ e.target.disabled=true; CODE=$('#code').value.replace(/\D/g,'');
    try{ second(await call('publicSignInfo',TOKEN,CODE)); }catch(err){ $('#msg').innerHTML=`\x3cdiv class="warn">${esc(err)}\x3c/div>`; e.target.disabled=false; } };
}

function second(d){
  $('#box').innerHTML=`\x3ch2>${esc(d.name)}님께 보내드린 물품\x3c/h2>
    \x3ctable>${d.items.map(i=>`\x3ctr>\x3ctd>${esc(i.name)}\x3c/td>\x3ctd>${i.qty}\x3c/td>\x3c/tr>`).join('')}\x3c/table>
    \x3cp class="muted">${esc(d.org)} · ${esc(d.date)}\x3c/p>
    \x3cp>잘 받으셨다면 아래 칸에 손가락으로 서명해 주세요.\x3c/p>
    \x3ccanvas id="pad">\x3c/canvas>
    \x3cbutton class="btn line" id="clr">다시 쓰기\x3c/button>\x3cbutton class="btn" id="ok">서명 보내기\x3c/button>\x3cdiv id="msg">\x3c/div>`;
  const cv=$('#pad'), dpr=window.devicePixelRatio||1, w=cv.clientWidth, h=cv.clientHeight;
  cv.width=w*dpr; cv.height=h*dpr; const g=cv.getContext('2d'); g.scale(dpr,dpr); g.lineWidth=4.5; g.lineCap='round'; g.lineJoin='round'; g.strokeStyle='#000';
  let down=false, drew=false, last=null;
  const pt=e=>{const r=cv.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top};};
  cv.onpointerdown=e=>{down=true;last=pt(e);cv.setPointerCapture(e.pointerId);};
  cv.onpointermove=e=>{if(!down)return;const p=pt(e);g.beginPath();g.moveTo(last.x,last.y);g.lineTo(p.x,p.y);g.stroke();last=p;drew=true;};
  cv.onpointerup=cv.onpointercancel=()=>{down=false;};
  $('#clr').onclick=()=>{g.clearRect(0,0,w,h);drew=false;};
  $('#ok').onclick=async e=>{
    if(!drew){ $('#msg').innerHTML='\x3cdiv class="warn">서명을 해 주세요.\x3c/div>'; return; }
    e.target.disabled=true; e.target.textContent='보내는 중...';
    try{ await call('publicSign',TOKEN,CODE,sigCrop(cv));
      $('#box').innerHTML='\x3cdiv class="ok">\x3ch2 style="margin:0 0 6px">고맙습니다!\x3c/h2>서명이 잘 전달됐어요. 이 창은 닫으셔도 돼요.\x3c/div>';
    }catch(err){ $('#msg').innerHTML=`\x3cdiv class="warn">${esc(err)}\x3c/div>`; e.target.disabled=false; e.target.textContent='서명 보내기'; }
  };
}
</script>
</body>
</html>
