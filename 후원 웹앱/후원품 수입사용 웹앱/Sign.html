<!DOCTYPE html>
<html lang="ko">
<head>
<base target="_top">
<meta charset="utf-8">
<style>
:root{--bg:#f6f7f4;--ink:#1f2a24;--sub:#5f6b64;--line:#dfe5df;--pri:#2f6b4f;--pri2:#e5f0ea;--warn:#b5532b;--warnbg:#fbeee6}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 "Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
header{background:var(--pri);color:#fff;padding:16px}
header h1{margin:0;font-size:19px}
main{max-width:520px;margin:0 auto;padding:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
h2{font-size:18px;margin:0 0 10px}
p{margin:0 0 10px}
input{width:100%;padding:14px;border:1px solid var(--line);border-radius:10px;font:inherit;font-size:20px;letter-spacing:4px;text-align:center}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:15px;font:inherit;font-weight:700;background:var(--pri);color:#fff;margin-top:12px;cursor:pointer}
.btn.line{background:#fff;border:1px solid var(--line);color:var(--ink)}
.btn:disabled{opacity:.6}
.warn{background:var(--warnbg);color:var(--warn);border-radius:10px;padding:12px;margin-top:10px}
.ok{background:var(--pri2);color:var(--pri);border-radius:10px;padding:14px}
table{width:100%;border-collapse:collapse;margin:6px 0 4px}
td{border-bottom:1px solid var(--line);padding:9px 4px}
td:last-child{text-align:right;font-weight:700}
#pad{border:2px dashed #b9c4bc;border-radius:12px;touch-action:none;background:#fff;display:block;width:100%;height:220px}
.muted{color:var(--sub);font-size:15px}
</style>
</head>
<body>
<header><h1>후원품 수령 확인</h1></header>
<main><div class="card" id="box">확인하는 중이에요...</div></main>
<script>
const $=s=>document.querySelector(s);
const esc=v=>String(v==null?'':v).replace(/[&\x3c>"']/g,c=>({'&':'&amp;','\x3c':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const call=(fn,...a)=>new Promise((res,rej)=>google.script.run.withSuccessHandler(res).withFailureHandler(e=>rej(e&&e.message?e.message:e))[fn](...a));
let TOKEN='', CODE='';
function fail(msg){ $('#box').innerHTML=`\x3ch2>링크를 열 수 없어요\x3c/h2>\x3cp>${esc(msg)}\x3c/p>`; }

google.script.url.getLocation(l=>{
  TOKEN=(l&&l.parameter&&l.parameter.s)||'';
  call('publicSignInfo',TOKEN).then(first).catch(fail);
});

function first(info){
  $('#box').innerHTML=`\x3ch2>${esc(info.name)}님, 안녕하세요\x3c/h2>
    \x3cp>보내드린 후원품을 받으셨는지 확인하는 화면이에요. 먼저 본인 확인을 해 주세요.\x3c/p>
    \x3cp class="muted">${esc(info.check)}\x3c/p>
    \x3cinput id="code" inputmode="numeric" maxlength="8" autocomplete="off">
    \x3cbutton class="btn" id="go">확인\x3c/button>\x3cdiv id="msg">\x3c/div>`;
  $('#go').onclick=async e=>{ e.target.disabled=true; CODE=$('#code').value.replace(/\D/g,'');
    try{ second(await call('publicSignInfo',TOKEN,CODE)); }catch(err){ $('#msg').innerHTML=`\x3cdiv class="warn">${esc(err)}\x3c/div>`; e.target.disabled=false; } };
}

function second(d){
  $('#box').innerHTML=`\x3ch2>${esc(d.name)}님께 보내드린 물품\x3c/h2>
    \x3ctable>${d.items.map(i=>`\x3ctr>\x3ctd>${esc(i.name)}\x3c/td>\x3ctd>${i.qty}\x3c/td>\x3c/tr>`).join('')}\x3c/table>
    \x3cp class="muted">${esc(d.org)} · ${esc(d.date)}\x3c/p>
    \x3cp>잘 받으셨다면 아래 칸에 손가락으로 서명해 주세요.\x3c/p>
    \x3ccanvas id="pad">\x3c/canvas>
    \x3cbutton class="btn line" id="clr">다시 쓰기\x3c/button>\x3cbutton class="btn" id="ok">서명 보내기\x3c/button>\x3cdiv id="msg">\x3c/div>`;
  const cv=$('#pad'), dpr=window.devicePixelRatio||1, w=cv.clientWidth, h=cv.clientHeight;
  cv.width=w*dpr; cv.height=h*dpr; const g=cv.getContext('2d'); g.scale(dpr,dpr); g.lineWidth=2.8; g.lineCap='round'; g.lineJoin='round'; g.strokeStyle='#111';
  let down=false, drew=false, last=null;
  const pt=e=>{const r=cv.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top};};
  cv.onpointerdown=e=>{down=true;last=pt(e);cv.setPointerCapture(e.pointerId);};
  cv.onpointermove=e=>{if(!down)return;const p=pt(e);g.beginPath();g.moveTo(last.x,last.y);g.lineTo(p.x,p.y);g.stroke();last=p;drew=true;};
  cv.onpointerup=cv.onpointercancel=()=>{down=false;};
  $('#clr').onclick=()=>{g.clearRect(0,0,w,h);drew=false;};
  $('#ok').onclick=async e=>{
    if(!drew){ $('#msg').innerHTML='\x3cdiv class="warn">서명을 해 주세요.\x3c/div>'; return; }
    e.target.disabled=true; e.target.textContent='보내는 중...';
    const o=document.createElement('canvas'); o.width=Math.round(w*1.2); o.height=Math.round(h*1.2); o.getContext('2d').drawImage(cv,0,0,o.width,o.height);
    try{ await call('publicSign',TOKEN,CODE,o.toDataURL('image/png'));
      $('#box').innerHTML='\x3cdiv class="ok">\x3ch2 style="margin:0 0 6px">고맙습니다!\x3c/h2>서명이 잘 전달됐어요. 이 창은 닫으셔도 돼요.\x3c/div>';
    }catch(err){ $('#msg').innerHTML=`\x3cdiv class="warn">${esc(err)}\x3c/div>`; e.target.disabled=false; e.target.textContent='서명 보내기'; }
  };
}
</script>
</body>
</html>
