<!DOCTYPE html>
<html lang="ko">
<head>
<base target="_top">
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{--bg:#f6f7f4;--card:#fff;--ink:#1f2a24;--sub:#5f6b64;--line:#dfe5df;--pri:#2f6b4f;--pri2:#e5f0ea;--warn:#b5532b;--warnbg:#fbeee6;--yel:#fff3b0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
header{background:var(--pri);color:#fff;padding:14px 16px}
header h1{margin:0;font-size:18px}
header small{opacity:.85}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
nav button{flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 13px;font-size:14px;color:var(--ink)}
nav button.on{background:var(--pri);border-color:var(--pri);color:#fff}
nav .dot{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:9px;background:var(--warn);color:#fff;font-size:12px}
main{max-width:860px;margin:0 auto;padding:14px 12px 80px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.card h2{font-size:16px;margin:0 0 10px}
.card h3{font-size:14px;margin:14px 0 6px;color:var(--sub)}
label{display:block;font-size:13px;color:var(--sub);margin:8px 0 3px}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;font:inherit;background:#fff}
textarea{min-height:90px}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1;min-width:120px}
.btn{display:inline-block;border:0;border-radius:9px;padding:10px 14px;font:inherit;font-weight:600;background:var(--pri);color:#fff;cursor:pointer}
.btn.sub{background:var(--pri2);color:var(--pri)}
.btn.line{background:#fff;border:1px solid var(--line);color:var(--ink)}
.btn.warn{background:var(--warn)}
.btn.sm{padding:6px 10px;font-size:13px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.note{background:var(--pri2);color:var(--pri);border-radius:9px;padding:10px 12px;font-size:13.5px;margin-bottom:10px}
.note.warn{background:var(--warnbg);color:var(--warn)}
.muted{color:var(--sub);font-size:13px}
.lot{display:flex;justify-content:space-between;gap:8px;padding:9px 10px;border:1px solid var(--line);border-radius:9px;margin-top:6px;cursor:pointer;background:#fff}
.lot.on{border-color:var(--pri);background:var(--pri2)}
.lot b{font-weight:600}
.lots{max-height:300px;overflow:auto}
.chip{display:inline-block;background:var(--pri2);color:var(--pri);border-radius:999px;padding:3px 10px;margin:3px 4px 0 0;font-size:13px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:6px 5px;text-align:left;vertical-align:middle}
.tbl th{font-size:12.5px;color:var(--sub);font-weight:600}
.tbl input{padding:6px 7px}
.tbl .q{width:64px}
.scroll{overflow-x:auto}
.tag{display:inline-block;border-radius:6px;padding:1px 7px;font-size:12px;background:#eef0ec;color:var(--sub)}
.tag.ok{background:var(--pri2);color:var(--pri)}.tag.wait{background:var(--warnbg);color:var(--warn)}
.exp{color:var(--warn);font-weight:600}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:10px;display:none;z-index:50;max-width:90%}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:40}
#modal .box{background:#fff;border-radius:14px;padding:16px;width:min(600px,94vw)}
#pad{border:2px dashed #b9c4bc;border-radius:10px;touch-action:none;background:#fff;display:block;width:100%}
.preview{border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff;overflow:auto}
#printArea{display:none}
body.viewer .frm,
body.viewer :is(#dGo,#oGo,#xGo,#vGo,#vAddOpen,#sEdit,#sLink,#sPdf,#oEdit,#oPdf,#dEdit,#hsEdit,#hsDone,#oScan,[data-s],[data-ln],[data-ok],[data-no],[data-ed],[data-r],[data-x],[data-l]){display:none!important}
/* ===== 화면 다듬기 (2026-11) · 관리 화면형 · 남색 · 수령증·인수증 출력 양식은 그대로 · 이 블록만 지우면 예전 모양 ===== */
:root{--bg:#fff;--card:#fff;--ink:#1d2329;--sub:#5d6670;--line:#dde1e6;--pri:#1f3a5f;--pri2:#edf2f7;--warn:#a8322a;--warnbg:#fbefed}
body{background:#fff;font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;word-break:keep-all}
/* 맨 위: 기관명 줄 */
header{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;background:#fff;color:var(--ink);max-width:1140px;margin:0 auto;padding:20px 20px 4px}
header h1{font-size:15px;font-weight:400;color:var(--sub)}
header h1::before{content:"종로장애인복지관";font-size:19px;font-weight:700;color:var(--ink);margin-right:12px}
header small{margin-left:auto;opacity:1;color:var(--sub);font-size:13px}
/* 메뉴: 밑줄 탭, 줄은 화면 끝까지 */
nav{gap:28px;padding:0 max(20px,calc((100% - 1100px)/2));background:#fff;border-bottom:1px solid var(--line)}
nav button{border:0;border-bottom:3px solid transparent;border-radius:0;background:none;padding:15px 0 12px;font-size:15px;color:var(--ink)}
nav button:hover{color:var(--pri)}
nav button.on{background:none;border-color:transparent;border-bottom-color:var(--pri);color:var(--pri);font-weight:700}
nav .dot{background:var(--warn);border-radius:2px}
main{max-width:1140px;padding:30px 20px 80px}
/* 칸: 그림자·둥근 모서리 없이 */
.card{border:1px solid var(--line);border-radius:0;padding:20px 22px;margin-bottom:20px}
.card h2{font-size:18px;margin:0 0 14px;letter-spacing:-.01em}
.card h3{color:var(--ink)}
label{color:var(--sub)}
input,select,textarea{border:1px solid #c9cfd6;border-radius:2px;min-height:42px}
textarea{min-height:90px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--pri);outline-offset:-1px}
/* 버튼: 남색 하나만 진하게 */
.btn{border-radius:2px;font-weight:700}
.btn:hover{filter:brightness(.92)}
.btn.sub{background:var(--pri2);color:var(--pri)}
.btn.line{border:1px solid #c9cfd6;background:#fff;color:var(--ink)}
.btn.line:hover{border-color:var(--pri);filter:none}
/* 안내 상자: 왼쪽 줄 */
.note{background:#f4f6f8;color:var(--ink);border-left:3px solid var(--pri);border-radius:0}
.note.warn{background:var(--warnbg);color:var(--warn);border-left-color:var(--warn)}
/* 물품 고르기 목록 */
.lot{border-radius:2px;border-color:var(--line)}
.lot:hover{border-color:#b9c1ca}
.lot.on{border-color:var(--pri);background:var(--pri2)}
.chip{border-radius:2px}
/* 표: 위에 남색 굵은 선 + 회색 머리줄 */
.tbl{border-top:2px solid var(--pri)}
.tbl th{background:#f4f6f8;color:var(--ink);font-weight:700;font-size:13.5px;padding:10px 8px}
.tbl td{padding:9px 8px;border-bottom-color:var(--line)}
.tag{border-radius:2px}
.tag.ok{background:var(--pri2);color:var(--pri)}
.exp{color:var(--warn)}
#modal .box{border-radius:2px;border-top:3px solid var(--pri)}
#toast{border-radius:2px;background:var(--ink)}
#pad{border:1px solid var(--ink);border-radius:2px}
.preview{border-radius:0}
@media(max-width:640px){header h1::before{display:block;margin:0 0 2px}nav{gap:20px}.card{padding:16px}}
@media print{
  @page{margin:10mm}
  body{background:#fff}
  #app,#toast,#modal{display:none!important}
  #printArea{display:block}
  #printArea, #printArea *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<div id="app">
  <header><h1>후원품 나눔 도우미</h1><small id="who"></small></header>
  <nav id="nav"></nav>
  <main id="main"><div class="card">불러오는 중이에요...</div></main>
</div>
<div id="printArea"></div>
<div id="toast"></div>
<div id="modal"><div class="box" id="modalBox"></div></div>

<script>
let RECEIPT_ID = '';
const S = { boot:null, tab:'', stock:[], staff:[], dist:null, home:null, org:null, disp:null };
const $ = s => document.querySelector(s);
const esc = v => String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','\x3c':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { const n=Number(String(v==null?'':v).replace(/[^\d.\-]/g,'')); return isFinite(n)?n:0; };
const MUTATING_CALLS=new Set(['createTeamReceipt','createOrgReceipt','requestHome','confirmHome','updateTeamReceipt','updateOrgReceipt','updateHomeSign','updateHomeTotals','giveVouchers','updateVoucherGive','cancelVoucherGive','addVouchers','dispose','updateDisposal','signReceipt','signHome','finishHome','saveReceiptPdf','markOrgReturned']);
let CALL_BUTTON=null;const FALLBACK_REQUESTS=new Map();
const requestToken=()=>globalThis.crypto&&crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+'_'+Math.random().toString(36).slice(2);
function checkInputQuantities(o){if(!o||typeof o!=='object')return;if(Array.isArray(o)){o.forEach(checkInputQuantities);return;}Object.entries(o).forEach(([k,v])=>{if(k==='qty'){const check=x=>{const t=String(x==null?'':x).trim().replace(/,/g,'');if(t&&(!/^(?:\d+(?:\.\d+)?|\.\d+)$/.test(t)||!Number.isFinite(Number(t))))throw Error('수량은 0 이상의 숫자로 입력해주세요.');};if(v&&typeof v==='object')Object.values(v).forEach(check);else check(v);}else if(v&&typeof v==='object')checkInputQuantities(v);});}
function run(fn,...a){
 if(MUTATING_CALLS.has(fn)){try{a.forEach(checkInputQuantities);}catch(e){return Promise.reject(e.message);}
  const cache=CALL_BUTTON?(CALL_BUTTON._requests||(CALL_BUTTON._requests=new Map())):FALLBACK_REQUESTS,key=fn+'|'+JSON.stringify(a);if(!cache.has(key))cache.set(key,requestToken());a.push(cache.get(key));}
 return new Promise((res,rej)=>google.script.run.withSuccessHandler(res).withFailureHandler(e=>rej(e&&e.message?e.message:e))[fn](...a));
}
function toast(t,ms){ const el=$('#toast'); el.textContent=t; el.style.display='block'; clearTimeout(el._t); el._t=setTimeout(()=>el.style.display='none',ms||2600); }
function busy(btn,on,txt){ if(!btn) return; if(on){btn._t=btn.textContent;btn.disabled=true;btn.textContent=txt||'처리 중...';} else {btn.disabled=false;btn.textContent=btn._t||btn.textContent;} }
async function act(btn,fn,txt){if(btn&&btn.disabled)return;busy(btn,true,txt);const previous=CALL_BUTTON;try{CALL_BUTTON=btn;let result;try{result=fn();}finally{CALL_BUTTON=previous;}const done=await result;if(btn)btn._requests=null;return done;}catch(e){alert(e&&e.message?e.message:e);}finally{CALL_BUTTON=previous;busy(btn,false);}}
function copyText(t){ (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('링크를 복사했어요. 메신저로 보내 주세요.')).catch(()=>prompt('아래 링크를 길게 눌러 복사해 주세요.',t)); }
function lotLabel(l){ return `${l.name} · ${l.inDate||'입고일 없음'} 입고`; }
function koDate(d){ const m=String(d||'').match(/^(\d{4})-(\d{2})-(\d{2})/); return m?`${m[1]}년 ${+m[2]}월 ${+m[3]}일`:''; }
function daysTo(d){ const m=String(d||'').match(/^(\d{4})-(\d{2})-(\d{2})$/); if(!m) return null; return Math.floor((new Date(+m[1],m[2]-1,+m[3]) - new Date(new Date().toDateString()))/864e5); }


const slow=setTimeout(()=>{ const c=$('#main .card'); if(c&&!S.boot) c.innerHTML='아직 불러오는 중이에요. 시트를 읽는 데 시간이 걸리고 있어요.\x3cbr>\x3cspan class="muted">1분이 넘으면 Apps Script → 실행 기록의 맨 위 줄을 캡처해서 알려 주세요.\x3c/span>'; },30000);
new Promise(res=>{ try{ google.script.url.getLocation(l=>res((l&&l.parameter&&l.parameter.r)||'')); }catch(e){ res(''); } }).then(r=>{ RECEIPT_ID=r; return run('getBoot', RECEIPT_ID); }).then(b=>{ clearTimeout(slow);
  S.boot=b; S.stock=b.stock||[]; S.staff=b.staff||[];
  $('#who').textContent = (b.admin?'관리자 · ':b.viewer?`보기 전용 (${b.viewer}까지) · `:'')+(b.me||'');
  if(b.viewer) document.body.classList.add('viewer');
  if (RECEIPT_ID) { $('#nav').style.display='none'; return signView(RECEIPT_ID, b.receipt); }
  buildNav(); go(b.admin ? (b.setupOk?'dist':'setup') : b.viewer ? 'sign' : 'home');
}).catch(e=>{ clearTimeout(slow); $('#main').innerHTML=`\x3cdiv class="card note warn">${esc(e)}\x3c/div>`; });

function expiring(){ const n=S.boot.alertDays||30; return S.stock.filter(l=>l.remain>0&&l.expiry&&daysTo(l.expiry)!=null&&daysTo(l.expiry)<=n).sort((a,b)=>daysTo(a.expiry)-daysTo(b.expiry)); }
function expiryCard(){ const L=expiring(); if(!L.length) return '';
  return `\x3cdiv class="card note warn" style="margin-bottom:12px">\x3cb>⏰ 유통기한이 지났거나 ${S.boot.alertDays||30}일 안에 끝나는 물품 ${L.length}개\x3c/b>\x3cbr>${L.map(l=>{const d=daysTo(l.expiry);return `· ${esc(l.name)} — 남은 ${l.remain}${esc(l.unit||'')} · 유통 ${esc(l.expiry)} \x3cb>${d<0?`(${-d}일 지남)`:d===0?'(오늘까지)':`(${d}일 남음)`}\x3c/b>`;}).join('\x3cbr>')}\x3c/div>`; }
function tabs(){ const c=S.boot.counts||{}; c.stock=expiring().length; if(S.boot.viewer) return [['sign','서명 현황',c.sign],['hsign','가정 서명',c.hsign],['homeok','가정 확인',c.home],['org','유관기관',c.org],['vouch','상품권'],['disp','폐기'],['stock','재고',c.stock]];
  return S.boot.admin
  ? [['dist','팀 배분'],['sign','서명 현황',c.sign],['home','가정 배분'],['hsign','가정 서명',c.hsign],['homeok','가정 확인',c.home],['org','유관기관',c.org],['vouch','상품권'],['disp','폐기'],['stock','재고',c.stock],['free','빈 수령증'],['setup','설정']]
  : [['home','가정 배분'],['hsign','가정 서명',c.hsign]].concat(S.boot.vouch?[['vouch','상품권']]:[]).concat([['stock','재고',c.stock],['free','빈 수령증']]); }
function buildNav(){ $('#nav').innerHTML = tabs().map(([k,t,n])=>`\x3cbutton data-k="${k}">${t}${n?`\x3cspan class="dot">${n}\x3c/span>`:''}\x3c/button>`).join(''); $('#nav').onclick=e=>{const b=e.target.closest('button'); if(b) go(b.dataset.k);}; }
async function refreshStock(fresh){ S.stock = await run('getStock', false,!!fresh); buildNav(); document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.k===S.tab)); }
/* 저장 직후 재고는 뒤에서 새로 불러옴 (다음 화면이 재고를 쓰지 않을 때만) — 저장 완료 안내를 기다리지 않고 바로 보여 줌 */
function refreshStockLater(){ refreshStock().catch(e=>console.warn('재고 새로고침 실패', e)); }
function go(k){
  S.tab=k; if(k==='dist'||k==='home') S.lv=null; $('#main').onclick=null; $('#main').oninput=null; document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.k===k));
  if(!S.boot.setupOk && k!=='setup'){ $('#main').innerHTML=`\x3cdiv class="card note">${S.boot.admin?'먼저 \x3cb>설정\x3c/b> 탭에서 시트 칸을 확인해 주세요.':'관리자가 아직 앱을 설정하고 있어요. 조금 뒤에 다시 열어 주세요.'}\x3c/div>`; return; }
  ({dist:distView,sign:signListView,home:homeView,homeok:homeOkView,vouch:vouchView,hsign:hsignView,org:orgView,disp:dispView,stock:stockView,free:freeView,setup:setupView})[k]();
}


function picker(el, sel, onChange, single){
  const draw = () => {
    const q=(el.querySelector('.pq')||{}).value||'';
    const list=S.stock.filter(l=>!q||l.name.includes(q)||(l.donor||'').includes(q));
    el.querySelector('.lots').innerHTML = list.length? list.map(l=>{ const d=daysTo(l.expiry);
      return `\x3cdiv class="lot ${sel.includes(l.key)?'on':''}" data-k="${esc(l.key)}">\x3cspan>\x3cb>${esc(l.name)}\x3c/b>\x3cbr>\x3cspan class="muted">${esc(l.inDate)} 입고${l.donor?' · '+esc(l.donor):''}${l.expiry?` · \x3cspan class="${d!=null&&d<=30?'exp':''}">유통 ${esc(l.expiry)}\x3c/span>`:''}\x3c/span>\x3c/span>\x3cspan>남은 \x3cb>${l.remain}\x3c/b>${esc(l.unit||'')}\x3c/span>\x3c/div>`;}).join('')
      : '\x3cp class="muted">남은 물품이 없어요.\x3c/p>';
  };
  el.innerHTML = `\x3cinput class="pq" placeholder="품명이나 후원처로 찾기">\x3cdiv class="lots">\x3c/div>\x3cdiv class="btns">\x3ca class="btn line sm" href="https://docs.google.com/forms/d/e/1FAIpQLSdFv6PF9OE8ac1YFcNvo2Q-MVCW1wAA5lnunsR5EDa6tuQZww/viewform" target="_blank" rel="noopener noreferrer">목록에 없는 후원품 등록\x3c/a>\x3cbutton type="button" class="btn sub sm pickerRefresh">등록 후 새로고침\x3c/button>\x3c/div>\x3cp class="muted" style="margin-top:6px">등록을 마친 뒤 새로고침해주세요. 연결된 등록 시트에 반영되고 재고가 남은 물품이 목록에 표시돼요.\x3c/p>`;
  el.querySelector('.pickerRefresh').onclick=e=>act(e.target,async()=>{await refreshStock(true);for(let i=sel.length-1;i>=0;i--)if(!S.stock.some(l=>l.key===sel[i]))sel.splice(i,1);draw();if(onChange)onChange();toast('물품 목록을 새로 불러왔어요.');},'불러오는 중...');
  el.querySelector('.pq').oninput=draw;
  el.querySelector('.lots').onclick=e=>{ const d=e.target.closest('.lot'); if(!d) return; const k=d.dataset.k, i=sel.indexOf(k);
    if(single){ sel.splice(0,sel.length); if(i<0) sel.push(k); } else if(i>=0) sel.splice(i,1); else sel.push(k);
    draw(); onChange&&onChange(); };
  draw();
}
const lotOf = k => S.stock.find(l=>l.key===k);


function receiptHtml(d){
  const items=d.items,n=items.length,types=[...new Set(d.rows.map(r=>r.idType||'주소'))],identityHeader=types.length===1?types[0]:'주소 / 생년월일';
  const cell='border:1px solid #333;padding:5px 4px;text-align:center;font-size:11pt;';
  const th=cell+'background:#eee;font-weight:bold;';
  let h=`\x3cdiv style="font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;color:#000">
  \x3ch1 style="text-align:center;font-size:24pt;letter-spacing:12px;margin:0 0 14px">수령증\x3c/h1>
  \x3ctable style="width:100%;border-collapse:collapse;margin-bottom:14px">\x3ctr>
  ${(d.heads||['품번','품목','입고일','후원처','배분처','총 수량','지원수량','잔여수량']).map(t=>`\x3cth style="${th}">${t}\x3c/th>`).join('')}\x3c/tr>

function fitPage(html, landscape){
  const W=landscape?1045:715, H=landscape?715:1045, m=document.createElement('div');
  m.style.cssText=`position:absolute;left:-99999px;top:0;width:${W}px;visibility:hidden`;
  m.innerHTML=html; document.body.appendChild(m);
  const z=Math.min(1, W/Math.max(m.scrollWidth,1), H/Math.max(m.scrollHeight,1)); m.remove();
  return `\x3cstyle>@page{size:A4 ${landscape?'landscape':'portrait'};margin:10mm}\x3c/style>\x3cdiv style="zoom:${z.toFixed(3)}">${html}\x3c/div>`;
}
function rgbHex(c){ const m=String(c).match(/rgba?\((\d+),\s*(\d+),\s*(\d+)(?:,\s*([\d.]+))?/); if(!m||m[4]==='0') return ''; return '#'+[m[1],m[2],m[3]].map(x=>(+x).toString(16).padStart(2,'0')).join(''); }
function htmlModel(html, landscape){
  const W=landscape?1045:715, m=document.createElement('div');
  m.style.cssText=`position:absolute;left:-99999px;top:0;width:${W}px;background:#fff`; m.innerHTML=html; document.body.appendChild(m);
  const sty=el=>{ const cs=getComputedStyle(el); return {bg:rgbHex(cs.backgroundColor), b:(parseInt(cs.fontWeight)||400)>=600||el.tagName==='TH', al:cs.textAlign==='right'||cs.textAlign==='end'?'right':cs.textAlign==='center'?'center':'left', fs:Math.max(7,Math.round(parseFloat(cs.fontSize)*0.75))}; };
  const txt=el=>(el.innerText||el.textContent||'').replace(/ /g,' ').trim();
  const out=[];
  const walk=el=>{ Array.from(el.children).forEach(c=>{
    if(c.tagName==='STYLE') return;
    if(c.tagName==='TABLE'){ out.push({type:'table', rows:Array.from(c.rows).map(tr=>({h:tr.offsetHeight, cells:Array.from(tr.cells).map(td=>Object.assign({t:txt(td),cs:td.colSpan,rs:td.rowSpan,w:td.offsetWidth,img:(td.querySelector('img')||{}).src||''},sty(td)))}))}); return; }
    if(c.querySelector('table')) return walk(c);
    out.push(Object.assign({type:'p',t:txt(c),h:c.offsetHeight},sty(c)));
  }); };
  walk(m); m.remove(); return out;
}

function signPad(title){
  return new Promise(res=>{
    const m=$('#modal'), box=$('#modalBox');
    box.innerHTML=`\x3ch2 style="margin:0 0 4px;font-size:17px">${esc(title)}\x3c/h2>\x3cp class="muted" style="margin:0 0 8px">아래 칸에 손가락으로 서명해 주세요.\x3c/p>\x3ccanvas id="pad">\x3c/canvas>

    m.style.display='flex';
    const cv=$('#pad'), w=box.clientWidth-32, h=Math.round(Math.min(w*0.45,260)), dpr=window.devicePixelRatio||1;
    cv.width=w*dpr; cv.height=h*dpr; cv.style.height=h+'px';
    const g=cv.getContext('2d'); g.scale(dpr,dpr); g.lineWidth=2.6; g.lineCap='round'; g.lineJoin='round'; g.strokeStyle='#111';
    let draw=false, drew=false, last=null;
    const pt=e=>{const r=cv.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top};};
    cv.onpointerdown=e=>{draw=true;last=pt(e);cv.setPointerCapture(e.pointerId);};
    cv.onpointermove=e=>{if(!draw)return;const p=pt(e);g.beginPath();g.moveTo(last.x,last.y);g.lineTo(p.x,p.y);g.stroke();last=p;drew=true;};
    cv.onpointerup=cv.onpointercancel=()=>{draw=false;};
    const close=v=>{m.style.display='none';box.innerHTML='';res(v);};
    $('#pc').onclick=()=>{g.clearRect(0,0,w,h);drew=false;};
    $('#px').onclick=()=>close(null);
    $('#po').onclick=()=>{ if(!drew) return toast('서명을 해 주세요.'); const o=document.createElement('canvas'); o.width=Math.round(w*1.2); o.height=Math.round(h*1.2); o.getContext('2d').drawImage(cv,0,0,o.width,o.height); close(o.toDataURL('image/png')); };
  });
}

async function vCheck(o){
  if(!S.lv) S.lv=await run('getLotVouchers')||{};
  const out={vsel:{},vskip:[]};
  o.sel.filter(k=>S.lv[k]&&o.need(k)>0).forEach(k=>{ const lot=lotOf(k)||{name:k}, n=o.need(k);
    if(S.lv[k].locked) throw `「${lot.name}」은 상품권이라 상품권 권한이 있는 직원만 나눌 수 있어요. 관리자에게 요청해 주세요.`;
    if(o.vskip.includes(k)){ out.vskip.push(k); return; }
    if(!Number.isInteger(n)) throw '상품권 수량은 정수로 넣어 주세요.';
    const got=(o.vsel[k]||[]).length; if(got!==n) throw `「${lot.name}」 상품권 번호를 ${n}장 골라 주세요. (지금 ${got}장)`;
    out.vsel[k]=o.vsel[k].slice(); });
  if(Object.keys(out.vsel).length&&!String(o.outBy||'').trim()) throw o.askBy?'상품권 출고담당자 이름을 적어 주세요.':'담당자를 골라 주세요.';
  out.outBy=String(o.outBy||'').trim();

      ${p.who==='당사자'?`\x3cdiv style="flex:2 1 200px">\x3cselect data-i="${i}" data-f="idType">\x3coption ${p.idType!=='생년월일'?'selected':''}>주소\x3c/option>\x3coption ${p.idType==='생년월일'?'selected':''}>생년월일\x3c/option>\x3c/select>\x3cinput data-i="${i}" data-f="addr" value="${esc(p.addr)}" placeholder="선택한 식별정보">\x3c/div>`:`\x3cdiv>\x3cinput data-i="${i}" data-f="team" value="${esc(p.team)}" placeholder="소속팀">\x3c/div>`}
      \x3cdiv style="flex:0 0 auto">\x3cbutton class="btn line sm" data-rm="${i}">사람 빼기\x3c/button>\x3c/div>\x3c/div>
      \x3cdiv style="margin-top:6px">${p.all.map(sr=>`\x3cspan class="chip" data-t="${i}|${esc(sr)}" style="cursor:pointer;${p.serials.includes(sr)?'':'opacity:.4;text-decoration:line-through'}">${esc(sr)}\x3c/span>`).join('')}\x3c/div>
      \x3cp class="muted" style="margin:4px 0 0">${p.serials.length}장${p.signed?' · 서명함':''} \x3cbutton class="btn line sm" data-add="${i}">＋ 상품권 추가\x3c/button>\x3c/p>\x3cdiv id="addBox${i}">\x3c/div>\x3c/div>`).join('')}
    \x3cdiv class="btns">\x3cspan style="flex:1">\x3c/span>\x3cbutton class="btn" id="evSave">저장\x3c/button>\x3c/div>\x3c/div>`;
    $('#evBack').onclick=()=>signView(r.id,r);
    $('#main').oninput=e=>{ const t=e.target; if(t.dataset.f){const p=E[t.dataset.i];if(t.dataset.f==='idType'&&p.idType!==t.value){p.addr='';const field=$(`[data-i="${t.dataset.i}"][data-f="addr"]`);if(field)field.value='';}p[t.dataset.f]=t.value;} };
    $('#main').onclick=async e=>{ const t=e.target.closest('[data-t],[data-rm],[data-add],[data-pk]'); if(!t) return;
      if(t.dataset.add){ const i=+t.dataset.add; if(!pool){ t.textContent='불러오는 중...'; const V=await run('getVouchers'); pool=V.held.filter(v=>groups.includes(v.kind+'|'+v.face+'|'+v.inDate)); }
        const used=new Set(E.flatMap(p=>p.serials)); const L=pool.filter(v=>!used.has(v.serial));
        $('#addBox'+i).innerHTML=L.length?`\x3cp class="muted" style="margin:6px 0 2px">같은 묶음에서 보유 중인 상품권 (눌러서 추가)\x3c/p>${L.map(v=>`\x3cspan class="chip" data-pk="${i}|${esc(v.serial)}" style="cursor:pointer;background:#fff;border:1px dashed var(--pri)">＋ ${esc(v.serial)}\x3c/span>`).join('')}`:'\x3cp class="muted">같은 묶음에 남은 상품권이 없어요. 다른 상품권은 새로 지급해 주세요.\x3c/p>'; return; }
      if(t.dataset.pk){ const [i,sr]=t.dataset.pk.split('|'), p=E[+i]; p.serials.push(sr); if(!p.all.includes(sr)) p.all.push(sr); draw(); return; }
      if(t.dataset.rm){ E.splice(+t.dataset.rm,1); draw(); return; }
      const [i,sr]=t.dataset.t.split('|'), p=E[+i], k=p.serials.indexOf(sr); if(k>=0) p.serials.splice(k,1); else p.serials.push(sr); draw(); };
    $('#evSave').onclick=e=>act(e.target, async()=>{
      const nr=await run('updateVoucherGive',r.id,E.map(p=>({i:p.i,name:p.name.trim(),team:p.team,addr:p.addr,idType:p.idType||'주소',serials:p.serials})));
      await refreshStock(); $('#main').oninput=null; toast('고쳤어요. 관리대장도 같이 바뀌었어요.',3000); signView(r.id,nr);
    }, '저장 중...');
  };
  draw();
}
function editOrg(r){
  const E={date:r.date, note:r.note||'', org:Object.assign({name:'',ceo:'',addr:'',tel:'',contact:''},r.orgInfo), items:r.items.map(it=>({key:it.key,name:it.name,qty:it.give,unit:it.unit}))};
  const F=[['name','기관명'],['ceo','대표자'],['addr','주소'],['tel','연락처'],['contact','수령자 (모르면 비워 두기)']];
  $('#main').innerHTML=`\x3cbutton class="btn line sm" id="eBack">← 인수증으로\x3c/button>
  \x3cdiv class="card">\x3ch2>인수증 내용 수정\x3c/h2>\x3cp class="note">고치면 \x3cb>배분 기록\x3c/b>도 같이 바뀌어요. 수량을 0으로 하면 그 품목은 빠져요. 인수증 내용이 바뀌면 \x3cb>회수 대기\x3c/b>로 돌아가며 수정한 문서를 다시 확인받아야 해요.\x3c/p>
  \x3cdiv class="row">${F.map(([k,t])=>`\x3cdiv>\x3clabel>${t}\x3c/label>\x3cinput data-o="${k}" value="${esc(E.org[k]||'')}">\x3c/div>`).join('')}\x3c/div>
  \x3cdiv class="row">\x3cdiv>\x3clabel>전달일\x3c/label>\x3cinput type="date" id="eDate" value="${E.date}">\x3c/div>\x3cdiv>\x3clabel>비고\x3c/label>\x3cinput id="eNote" value="${esc(E.note)}">\x3c/div>\x3c/div>
  \x3ctable class="tbl" style="margin-top:10px">\x3ctr>\x3cth>품목\x3c/th>\x3cth>수량\x3c/th>\x3cth>단위\x3c/th>\x3c/tr>${E.items.map((it,i)=>`\x3ctr>\x3ctd>${esc(it.name)}\x3c/td>\x3ctd>\x3cinput class="q" inputmode="numeric" data-q="${i}" value="${it.qty}">\x3c/td>\x3ctd>\x3cinput class="q" data-u="${i}" value="${esc(it.unit||'')}">\x3c/td>\x3c/tr>`).join('')}\x3c/table>
  \x3cdiv class="btns">\x3cspan style="flex:1">\x3c/span>\x3cbutton class="btn" id="eSave">저장\x3c/button>\x3c/div>\x3c/div>`;
  $('#eBack').onclick=()=>showOrg(r);
  $('#eDate').onchange=e=>E.date=e.target.value; $('#eNote').oninput=e=>E.note=e.target.value;
  $('#main').oninput=e=>{ const t=e.target; if(t.dataset.o) E.org[t.dataset.o]=t.value; if(t.dataset.q) E.items[t.dataset.q].qty=t.value; if(t.dataset.u) E.items[t.dataset.u].unit=t.value; };
  $('#eSave').onclick=e=>act(e.target, async()=>{
    const nr=await run('updateOrgReceipt',r.id,{date:E.date,note:E.note,org:E.org,items:E.items.map(it=>({key:it.key,qty:it.qty,unit:it.unit}))});
    await refreshStock(); toast('고쳤어요. 배분 기록도 같이 바뀌었어요.',3000); showOrg(nr);
  }, '저장 중...');
}
async function signListView(){
  $('#main').innerHTML='\x3cdiv class="card">불러오는 중이에요...\x3c/div>';
  const list=(await run('listReceipts')).filter(r=>r.type==='팀'||(r.type==='상품권'&&r.status!=='취소'));
  $('#main').innerHTML=`\x3cdiv class="card">\x3ch2>팀 배분 수령증\x3c/h2>${list.length?`\x3ctable class="tbl">${list.map(r=>`\x3ctr>\x3ctd>\x3cb>${esc(r.no)}\x3c/b>\x3cbr>\x3cspan class="muted">${esc(r.names)}\x3c/span>\x3c/td>
    \x3ctd style="white-space:nowrap;text-align:right">${r.status==='완료'?'\x3cspan class="tag ok">완료\x3c/span>':`\x3cspan class="tag wait">${r.done}/${r.total}\x3c/span>`}\x3cbr>
    \x3cbutton class="btn sm sub" data-o="${r.id}">열기\x3c/button> \x3cbutton class="btn sm line" data-xl="${r.id}">엑셀\x3c/button>${r.status!=='완료'?` \x3cbutton class="btn sm line" data-l="${esc(r.url)}">링크\x3c/button>`:''}${r.file?` \x3ca class="btn sm line" href="${esc(r.file)}" target="_blank">PDF\x3c/a>`:''}\x3c/td>\x3c/tr>`).join('')}\x3c/table>`:'\x3cp class="muted">아직 없어요.\x3c/p>'}\x3c/div>`;
  $('#main').onclick=e=>{ const t=e.target; if(t.dataset.o) signView(t.dataset.o); if(t.dataset.l) copyText(t.dataset.l); if(t.dataset.xl) rcptExcel(t,t.dataset.xl); };
}


function freeView(){
  const KINDS={buy:['구입일','구입처'],don:['입고일','후원처'],etc:['날짜','제공처']};
  const F=S.free||(S.free={kind:'buy',date:S.boot.today,dest:S.boot.dept||'',mode:'team',idType:'주소',fill:false,items:[{name:'',inDate:'',src:'',inQty:''}],rows:[]});
  const qOf=(r,i)=>num(r.qty[i]);
  const total=i=>F.rows.filter(r=>r.name).reduce((s,r)=>s+qOf(r,i),0);
  const html=()=>{ const K=KINDS[F.kind], its=F.items.filter(it=>it.name.trim());
    return receiptHtml({dest:F.dest, noTeam:F.mode==='home', noId:F.mode==='team', heads:['품번','품목',K[0],K[1],'배분처','총 수량','지원수량','잔여수량'],
      items:its.map(it=>{ const g=total(F.items.indexOf(it)), q=it.inQty===''?'':num(it.inQty); return {name:it.name.trim(),inDate:it.inDate,donor:it.src,give:g,inQty:q===''?g:q,remainAfter:q===''?'':q-g}; }),
      rows:F.rows.filter(r=>r.name).map(r=>({name:r.name,team:F.mode==='team'?r.team:'',addr:F.mode==='home'?r.addr:'',idType:F.idType,date:F.fill?F.date:'',sigUrl:'',note:r.note||'',qty:its.map(it=>qOf(r,F.items.indexOf(it))||'')}))}); };
  $('#main').innerHTML=`\x3cdiv class="note">📝 후원품이 아닌 물품(직접 구입한 물품 등)을 같은 수령증 양식으로 뽑는 곳이에요. \x3cb>후원품 대장·재고에는 아무것도 저장되지 않아요.\x3c/b> 새로고침하면 입력한 내용도 사라져요.\x3c/div>
  \x3cdiv class="card">\x3ch2>1. 물품\x3c/h2>
    \x3cdiv class="row">\x3cdiv>\x3clabel>물품 구분\x3c/label>\x3cselect id="fKind">${[['buy','구입한 물품 (구입일·구입처)'],['don','후원품 (입고일·후원처)'],['etc','기타 (날짜·제공처)']].map(o=>`\x3coption value="${o[0]}" ${F.kind===o[0]?'selected':''}>${o[1]}\x3c/option>`).join('')}\x3c/select>\x3c/div>
    \x3cdiv>\x3clabel>배분처\x3c/label>\x3cinput id="fDest" value="${esc(F.dest)}">\x3c/div>\x3c/div>
    \x3cdiv id="fItems">\x3c/div>\x3cdiv class="btns">\x3cbutton class="btn sub" id="fAddItem">물품 추가\x3c/button>\x3c/div>\x3c/div>
  \x3cdiv class="card">\x3ch2>2. 받는 분\x3c/h2>
    \x3cdiv class="row">\x3cdiv>\x3clabel>수령증 형태\x3c/label>\x3cselect id="fMode">\x3coption value="team" ${F.mode==='team'?'selected':''}>직원 (성명·소속팀)\x3c/option>\x3coption value="home" ${F.mode==='home'?'selected':''}>가정·개인 (성명·주소 또는 생년월일)\x3c/option>\x3c/select>\x3c/div>
    \x3cdiv>\x3clabel>수령일\x3c/label>\x3cinput type="date" id="fDate" value="${F.date}">\x3c/div>\x3c/div>
    \x3clabel style="display:flex;gap:6px;align-items:center;color:var(--ink)">\x3cinput type="checkbox" id="fFill" ${F.fill?'checked':''} style="width:auto"> 수령일 칸을 위 날짜로 채워서 출력 (안 하면 빈칸 → 손으로 쓰기)\x3c/label>
    ${F.mode==='home'?`\x3clabel>식별정보\x3cselect id="fId">\x3coption ${F.idType==='주소'?'selected':''}>주소\x3c/option>\x3coption ${F.idType==='생년월일'?'selected':''}>생년월일\x3c/option>\x3c/select>\x3c/label>`:''}
    \x3clabel>한 줄에 한 분씩 「이름, ${F.mode==='team'?'소속팀':'주소 또는 생년월일'}」 (엑셀에서 복사해 붙여도 돼요)\x3c/label>\x3ctextarea id="fPaste" placeholder="${F.mode==='team'?'홍길동, 일상동행팀':'홍길동, 종로구 예시로 1'}">\x3c/textarea>
    \x3cdiv class="btns">\x3cbutton class="btn sub" id="fParse">명단 넣기\x3c/button>${F.mode==='team'?'\x3cinput id="fWho" list="staffList" placeholder="직원 이름 입력·선택" style="flex:1;min-width:140px">\x3cbutton class="btn line" id="fWhoAdd">추가\x3c/button>':`\x3cbutton class="btn line" id="fOne">한 분 추가\x3c/button>${S.boot.fam?'\x3cbutton class="btn sub" id="fFam">이용인 명단에서 고르기\x3c/button>':''}`}\x3c/div>
    \x3cdatalist id="staffList">${S.staff.map(s=>`\x3coption value="${esc(s.name)}">${esc(s.team)}\x3c/option>`).join('')}\x3c/datalist>\x3cdiv id="fRows" style="margin-top:10px">\x3c/div>\x3c/div>
  \x3cdiv class="card">\x3ch2>3. 출력\x3c/h2>\x3cp class="muted">서명은 출력한 종이에 받아요.\x3c/p>
    \x3cdiv class="btns">\x3cbutton class="btn" id="fPrint">인쇄 · PDF\x3c/button>${xlsBtn('fXls')}\x3cbutton class="btn line" id="fClear">모두 지우기\x3c/button>\x3c/div>\x3c/div>`;
  const drawItems=()=>{ const K=KINDS[F.kind];
    $('#fItems').innerHTML=`\x3cdiv style="overflow-x:auto">\x3ctable class="tbl">\x3ctr>\x3cth>품목\x3c/th>\x3cth>${K[0]}\x3c/th>\x3cth>${K[1]}\x3c/th>\x3cth>총 수량 \x3cspan class="muted">(비우면 나눈 만큼)\x3c/span>\x3c/th>\x3cth>\x3c/th>\x3c/tr>
      ${F.items.map((it,i)=>`\x3ctr>\x3ctd>\x3cinput data-ii="${i}" data-f="name" value="${esc(it.name)}" placeholder="예: 생수 2L">\x3c/td>\x3ctd>\x3cinput type="date" data-ii="${i}" data-f="inDate" value="${esc(it.inDate)}">\x3c/td>\x3ctd>\x3cinput data-ii="${i}" data-f="src" value="${esc(it.src)}">\x3c/td>\x3ctd>\x3cinput class="q" inputmode="numeric" data-ii="${i}" data-f="inQty" value="${esc(it.inQty)}">\x3c/td>\x3ctd>${F.items.length>1?`\x3cbutton class="btn line sm" data-xi="${i}">빼기\x3c/button>`:''}\x3c/td>\x3c/tr>`).join('')}\x3c/table>\x3c/div>`; };
  const drawRows=()=>{ const its=F.items.map((it,i)=>({it,i})).filter(o=>o.it.name.trim());
    if(!F.rows.length){ $('#fRows').innerHTML='\x3cp class="muted">받는 분을 넣어 주세요.\x3c/p>'; return; }
    $('#fRows').innerHTML=`\x3cdiv style="overflow-x:auto">\x3ctable class="tbl">\x3ctr>\x3cth>성명\x3c/th>\x3cth>${F.mode==='team'?'소속팀':F.idType}\x3c/th>${its.map(o=>`\x3cth>${esc(o.it.name)}\x3cbr>\x3cspan class="muted" data-tot="${o.i}">합계 ${total(o.i)}\x3c/span>\x3c/th>`).join('')}\x3cth>비고\x3c/th>\x3cth>\x3c/th>\x3c/tr>
      ${F.rows.map((r,ri)=>`\x3ctr>\x3ctd>\x3cinput data-ri="${ri}" data-f="name" value="${esc(r.name)}">\x3c/td>\x3ctd>\x3cinput data-ri="${ri}" data-f="${F.mode==='team'?'team':'addr'}" value="${esc(F.mode==='team'?r.team:r.addr)}">\x3c/td>${its.map(o=>`\x3ctd>\x3cinput class="q" inputmode="numeric" data-ri="${ri}" data-qi="${o.i}" value="${r.qty[o.i]??''}">\x3c/td>`).join('')}\x3ctd>\x3cinput data-ri="${ri}" data-f="note" value="${esc(r.note||'')}">\x3c/td>\x3ctd>\x3cbutton class="btn line sm" data-xr="${ri}">빼기\x3c/button>\x3c/td>\x3c/tr>`).join('')}\x3c/table>\x3c/div>
      ${its.length?`\x3cdiv class="btns">\x3cbutton class="btn line sm" id="fAll">모든 분 1개씩 채우기\x3c/button>\x3c/div>`:'\x3cp class="muted">위에 물품 이름을 넣으면 수량 칸이 생겨요.\x3c/p>'}`;
    const a=$('#fAll'); if(a) a.onclick=()=>{ F.rows.forEach(r=>its.forEach(o=>{ if(r.qty[o.i]===undefined||r.qty[o.i]==='') r.qty[o.i]=1; })); drawRows(); }; };
  drawItems(); drawRows();
  $('#fKind').onchange=e=>{ F.kind=e.target.value; drawItems(); };
  $('#fDest').oninput=e=>{ F.dest=e.target.value; };
  $('#fMode').onchange=e=>{ F.mode=e.target.value; freeView(); };
  $('#fDate').onchange=e=>{ F.date=e.target.value; };
  $('#fFill').onchange=e=>{ F.fill=e.target.checked; };
  if($('#fId')) $('#fId').onchange=e=>{ F.idType=e.target.value; drawRows(); };
  $('#fAddItem').onclick=()=>{ F.items.push({name:'',inDate:'',src:'',inQty:''}); drawItems(); };
  $('#fItems').oninput=e=>{ const t=e.target; if(t.dataset.ii===undefined) return; F.items[+t.dataset.ii][t.dataset.f]=t.value; if(t.dataset.f==='name') drawRows(); };
  $('#fItems').onclick=e=>{ const i=e.target.dataset.xi; if(i===undefined) return; F.items.splice(+i,1); F.rows.forEach(r=>{ const q={}; Object.keys(r.qty).forEach(k=>{ if(+k<+i) q[k]=r.qty[k]; else if(+k>+i) q[+k-1]=r.qty[k]; }); r.qty=q; }); drawItems(); drawRows(); };
  $('#fRows').oninput=e=>{ const t=e.target, ri=t.dataset.ri; if(ri===undefined) return; const r=F.rows[+ri];
    if(t.dataset.qi!==undefined){ r.qty[t.dataset.qi]=t.value; const tt=document.querySelector(`[data-tot="${t.dataset.qi}"]`); if(tt) tt.textContent='합계 '+total(+t.dataset.qi); } else r[t.dataset.f]=t.value; };
  $('#fRows').onclick=e=>{ const i=e.target.dataset.xr; if(i===undefined) return; F.rows.splice(+i,1); drawRows(); };
  $('#fParse').onclick=()=>{ $('#fPaste').value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean).forEach(line=>{ const p=line.split(/\t|,/).map(x=>x.trim()), rest=p.slice(1).filter(Boolean).join(' ');
    F.rows.push(F.mode==='team'?{name:p[0],team:rest||((S.staff.find(x=>x.name===p[0])||{}).team||''),qty:{}}:{name:p[0],addr:rest,qty:{}}); }); $('#fPaste').value=''; drawRows(); };
  if($('#fWhoAdd')){ const add=()=>{ const n=$('#fWho').value.trim(); if(!n) return; const st=S.staff.find(x=>x.name===n); F.rows.push({name:n,team:st?st.team:'',qty:{}}); $('#fWho').value=''; drawRows(); };
    $('#fWhoAdd').onclick=add; $('#fWho').onkeydown=e=>{ if(e.key==='Enter') add(); }; }
  if($('#fOne')) $('#fOne').onclick=()=>{ F.rows.push({name:'',addr:'',qty:{}}); drawRows(); };
  if($('#fFam')) $('#fFam').onclick=()=>famPick('이용인 명단에서 고르기',L=>{ L.forEach(f=>F.rows.push({name:f.name,addr:F.idType==='생년월일'?f.birth:f.addr,qty:{}})); drawRows(); });

    $('#kList').innerHTML=L.length?L.map(l=>{ const d=daysTo(l.expiry);
      return `\x3cdiv class="lot" style="cursor:default">\x3cspan>\x3cb>${esc(l.name)}\x3c/b>\x3cbr>\x3cspan class="muted">${esc(l.inDate)} 입고${l.donor?' · '+esc(l.donor):''}${l.expiry?` · \x3cspan class="${d!=null&&d<=30?'exp':''}">유통 ${esc(l.expiry)}${d!=null&&d<0?' (지남)':d!=null&&d<=30?` (${d}일 남음)`:''}\x3c/span>`:''}\x3c/span>
      ${(S.boot.admin||S.boot.viewer)?`\x3cbr>\x3cspan class="muted">입고 ${l.inQty} · 나감 ${l.out} · 폐기 ${l.disp}${l.pending?` · 확인 대기 ${l.pending}`:''}\x3c/span>`:''}${l.photo&&/^https?:/.test(l.photo)?` \x3ca href="${esc(l.photo)}" target="_blank" class="muted">사진\x3c/a>`:''}\x3c/span>
      \x3cspan style="white-space:nowrap">남은 \x3cb>${l.remain}\x3c/b>${esc(l.unit||'')}\x3c/span>\x3c/div>`;}).join(''):'\x3cp class="muted">없어요.\x3c/p>'; };
  let check='';
  if((S.boot.admin||S.boot.viewer)){ const full=await run('getStock',true);
    const odd=full.filter(l=>l.remain<0||(l.done&&l.remain>0));
    if(odd.length) check=`\x3cdiv class="card note warn">\x3cb>확인이 필요한 물품 ${odd.length}개\x3c/b>\x3cbr>${odd.map(l=>`· ${esc(l.name)} (${esc(l.inDate)} 입고) — ${l.remain<0?`남은 수량 ${l.remain}: 등록 시트 지원수량(M열)과 배분 기록에 \x3cb>두 번\x3c/b> 들어갔는지 확인`:`사용완료 체크인데 ${l.remain}개 남음: 지원수량(M열)에 나간 수량 입력`}`).join('\x3cbr>')}\x3c/div>`; }
  $('#main').innerHTML=expiryCard()+check+`\x3cdiv class="card">\x3ch2>재고 \x3cbutton class="btn line sm" id="kFresh" style="float:right">↻ 최신으로\x3c/button>\x3c/h2>\x3cinput id="kq" placeholder="품명이나 후원처로 찾기">
  ${(S.boot.admin||S.boot.viewer)?'\x3clabel style="display:flex;gap:8px;align-items:center;color:var(--ink)">\x3cinput type="checkbox" id="kAll" style="width:auto"> 다 나간 물품도 보기\x3c/label>':''}\x3cdiv id="kList">\x3c/div>\x3cp style="margin-top:12px">\x3ca href="https://docs.google.com/forms/d/e/1FAIpQLSdFv6PF9OE8ac1YFcNvo2Q-MVCW1wAA5lnunsR5EDa6tuQZww/viewform" target="_blank" rel="noopener noreferrer">목록에 없는 후원품 등록 ↗\x3c/a>\x3c/p>\x3c/div>`;
  $('#kq').oninput=draw;
  $('#kFresh').onclick=e=>act(e.target, async()=>{ S.stock=await run('getStock',false,true); list=all?await run('getStock',true):S.stock; buildNav(); draw(); toast('시트를 다시 읽었어요.'); }, '읽는 중...');
  $('#kAll')&&($('#kAll').onchange=async e=>{ all=e.target.checked; $('#kList').innerHTML='\x3cp class="muted">불러오는 중...\x3c/p>'; list=all?await run('getStock',true):S.stock; draw(); });
  draw();
}


async function setupView(){
  $('#main').innerHTML='\x3cdiv class="card">시트를 읽는 중이에요...\x3c/div>';
  const infos=await run('getSetup');
  $('#main').innerHTML=`\x3cdiv class="note">앱이 시트 칸 이름을 보고 \x3cb>짐작한 결과\x3c/b>예요. 맞는지 보고 \x3cb>저장\x3c/b>을 눌러 주세요. 저장하기 전에는 시트에 아무것도 쓰지 않아요.\x3cbr>
  \x3cspan class="tag">수식\x3c/span> 표시가 있는 칸은 수식이 알아서 채우는 칸이라 앱이 \x3cb>쓰지 않아요\x3c/b>.\x3c/div>
  \x3cdiv class="card">\x3ch2>수령증 배분처\x3c/h2>\x3cp class="muted" style="margin:0 0 6px">수령증 위쪽 「배분처」 칸에 들어가는 후원 담당 팀이에요.\x3c/p>\x3cdiv class="row">\x3cdiv>\x3cinput id="deptIn" value="${esc(S.boot.dept||'일상동행팀')}">\x3c/div>\x3cdiv style="flex:0 0 auto">\x3cbutton class="btn sm" id="deptSave">저장\x3c/button>\x3c/div>\x3c/div>\x3c/div>
  \x3cdiv class="card">\x3ch2>상품권 사용 권한\x3c/h2>\x3cp class="muted" style="margin:0 0 6px">상품권 탭을 쓸 직원의 \x3cb>기관 메일\x3c/b>을 한 줄에 하나씩 넣어 주세요. 이 직원들은 상품권 \x3cb>지급·수령증·본인이 지급한 것 수정/취소\x3c/b>만 할 수 있어요. 입고와 다른 탭 관리는 관리자만 해요.\x3c/p>
  \x3ctextarea id="vuIn" placeholder="hong@example.org" style="min-height:70px">\x3c/textarea>\x3cdiv class="btns">\x3cbutton class="btn sm" id="vuSave">저장\x3c/button>\x3c/div>\x3c/div>
  \x3cdiv class="card">\x3ch2>보기 전용 권한 (팀장님·국장님 등)\x3c/h2>\x3cp class="muted" style="margin:0 0 6px">모든 탭을 \x3cb>볼 수만\x3c/b> 있어요(수령증 열기·인쇄·엑셀 가능). 등록·수정·취소는 관리자만 해요. \x3cb>만료일\x3c/b>이 지나면 저절로 닫혀요.\x3c/p>
  \x3cdiv id="vwList">\x3c/div>\x3cdiv class="row" style="margin-top:6px">\x3cdiv>\x3cinput id="vwMail" placeholder="기관 메일">\x3c/div>\x3cdiv style="flex:0 0 150px">\x3cinput type="date" id="vwUntil">\x3c/div>\x3cdiv style="flex:0 0 auto">\x3cbutton class="btn sm" id="vwAdd">추가\x3c/button>\x3c/div>\x3c/div>\x3c/div>
  \x3cdiv class="card">\x3ch2>이용인 명단 사용 권한\x3c/h2>\x3cp class="muted" style="margin:0 0 6px">가정 배분·상품권에서 \x3cb>「이용인 명단」 탭\x3c/b>을 불러와 골라 넣을 수 있는 직원의 \x3cb>기관 메일\x3c/b>을 한 줄에 하나씩 넣어 주세요. 관리자는 항상 쓸 수 있어요. 탭은 숨기거나 잠가도 불러와져요.\x3c/p>
  \x3ctextarea id="fuIn" placeholder="teamlead@example.org" style="min-height:60px">\x3c/textarea>\x3cdiv class="btns">\x3cbutton class="btn sm" id="fuSave">저장\x3c/button>\x3c/div>\x3c/div>
  \x3cdiv class="card">\x3ch2>외부 서명용 주소 (서명 링크)\x3c/h2>\x3cp class="muted" style="margin:0 0 6px">택배로 받은 분께 문자·카톡으로 서명 링크를 보낼 때 쓰는 주소예요. 배포를 하나 더 만들어(액세스: \x3cb>모든 사용자\x3c/b>) 그 웹 앱 주소(…/exec)를 넣어 주세요. 이 주소로는 \x3cb>서명 화면만\x3c/b> 열리고 다른 기능은 막혀 있어요.\x3c/p>
  \x3cdiv class="row">\x3cdiv>\x3cinput id="puIn" value="${esc(S.boot.publicUrl||'')}" placeholder="https://script.google.com/…/exec">\x3c/div>\x3cdiv style="flex:0 0 auto">\x3cbutton class="btn sm" id="puSave">저장\x3c/button>\x3c/div>\x3c/div>\x3c/div>
  \x3cdiv id="cards">\x3c/div>`;
  let VW=[]; const drawVw=()=>{ $('#vwList').innerHTML=VW.length?`\x3ctable class="tbl">${VW.map((v,i)=>`\x3ctr>\x3ctd>${esc(v.email)}\x3c/td>\x3ctd>${esc(v.until)}까지 ${v.until>=S.boot.today?'\x3cspan class="tag ok">사용 중\x3c/span>':'\x3cspan class="tag">만료\x3c/span>'}\x3c/td>\x3ctd style="text-align:right">\x3cbutton class="btn line sm" data-vw="${i}">빼기\x3c/button>\x3c/td>\x3c/tr>`).join('')}\x3c/table>`:'\x3cp class="muted">아직 없어요.\x3c/p>'; };
  const saveVw=async btn=>act(btn,async()=>{ VW=await run('saveViewers',VW); drawVw(); toast('저장했어요.'); },'저장 중...');
  run('getViewers').then(v=>{ VW=v; if($('#vwList')) drawVw(); });
  $('#vwList').onclick=e=>{ const i=e.target.dataset.vw; if(i===undefined) return; VW.splice(+i,1); saveVw(e.target); };
  $('#vwAdd').onclick=e=>{ const m=$('#vwMail').value.trim(), u=$('#vwUntil').value; if(!/@/.test(m)||!u) return toast('메일과 만료일을 넣어 주세요.'); VW=VW.filter(v=>v.email!==m.toLowerCase()).concat([{email:m,until:u}]); $('#vwMail').value=''; saveVw(e.target); };
  run('getFamUsers').then(v=>{ if($('#fuIn')) $('#fuIn').value=v.join('\n'); });
  $('#fuSave').onclick=e=>act(e.target, async()=>{ const v=await run('saveFamUsers',$('#fuIn').value); $('#fuIn').value=v.join('\n'); toast(`${v.length}명에게 명단 권한을 줬어요.`); });
  $('#puSave').onclick=e=>act(e.target, async()=>{ S.boot.publicUrl=await run('savePublicUrl',$('#puIn').value); toast('저장했어요.'); });
  run('getVoucherUsers').then(v=>{ if($('#vuIn')) $('#vuIn').value=v.join('\n'); });
  $('#vuSave').onclick=e=>act(e.target, async()=>{ const v=await run('saveVoucherUsers',$('#vuIn').value); $('#vuIn').value=v.join('\n'); toast(`${v.length}명에게 상품권 권한을 줬어요.`); });
  $('#deptSave').onclick=e=>act(e.target, async()=>{ S.boot.dept=await run('saveDept',$('#deptIn').value); toast('저장했어요.'); });
  infos.forEach(drawCard);
  function drawCard(info){
    let el=document.getElementById('c_'+info.key); if(!el){ el=document.createElement('div'); el.className='card'; el.id='c_'+info.key; $('#cards').appendChild(el); }
    if(info.missing){ el.innerHTML=`\x3ch2>${esc(info.sheet)}\x3c/h2>\x3cp class="note warn">「${esc(info.sheet)}」 시트를 찾지 못했어요. 시트 이름이 다르면 알려 주세요.\x3c/p>`; return; }
    el.innerHTML=`\x3ch2>${esc(info.sheet)} ${info.confirmed?'\x3cspan class="tag ok">확인됨\x3c/span>':'\x3cspan class="tag wait">확인 필요\x3c/span>'}\x3c/h2>
    \x3cdiv class="row">\x3cdiv>\x3clabel>제목 줄 (몇 번째 줄에 칸 이름이 있나요?)\x3c/label>\x3cdiv class="row">\x3cinput id="hr_${info.key}" type="number" min="1" value="${info.headerRow}">\x3cbutton class="btn line sm" id="re_${info.key}" style="flex:0 0 auto">다시 읽기\x3c/button>\x3c/div>\x3c/div>\x3c/div>
    \x3ctable class="tbl" style="margin-top:8px">${info.fields.map(f=>`\x3ctr>\x3ctd>${esc(f.label)}${f.required?' \x3cspan class="exp">*\x3c/span>':''}\x3c/td>\x3ctd>\x3cselect data-f="${f.f}">\x3coption value="">— 없음 —\x3c/option>${info.headers.map(h=>`\x3coption value="${h.col}" ${info.cols[f.f]===h.col?'selected':''}>${h.letter} · ${esc(h.text||'(빈 칸)')}${h.auto?' [수식]':''}\x3c/option>`).join('')}\x3c/select>\x3c/td>\x3c/tr>`).join('')}\x3c/table>
    \x3cp class="muted">${info.headers.filter(h=>h.auto).map(h=>`${h.letter}(${esc(h.text)})`).join(', ')?'수식 칸: '+info.headers.filter(h=>h.auto).map(h=>`${h.letter} ${esc(h.text)}`).join(', '):''}\x3c/p>
    \x3cdiv class="btns">\x3cbutton class="btn" id="sv_${info.key}">이대로 저장\x3c/button>\x3c/div>`;
    $('#re_'+info.key).onclick=e=>act(e.target,async()=>drawCard(await run('getSheetInfo',info.key,$('#hr_'+info.key).value)),'읽는 중...');
    $('#sv_'+info.key).onclick=e=>act(e.target,async()=>{ const cols={}; el.querySelectorAll('select[data-f]').forEach(s=>{ if(s.value) cols[s.dataset.f]=+s.value; });
      const r=await run('saveSetup',info.key,$('#hr_'+info.key).value,cols); drawCard(r); toast('저장했어요.');
      const b=await run('getBoot',''); S.boot=b; S.stock=b.stock||[]; S.staff=b.staff||[]; buildNav(); document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('on',x.dataset.k==='setup'));
      if(b.setupOk) toast('설정이 끝났어요! 이제 다른 탭을 쓸 수 있어요.',3500); },'저장 중...');
  }
}
</script>
</body>
