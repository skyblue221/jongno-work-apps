<script>
/* 장애이해교육 결과보고서 HWPX 생성기
 *   EduGen.buildZip(zip, data, images) → Promise(zip)
 *   data: { programName, goal, dates:[iso], time, place,
 *           attendees:[{group,count,names}], topics(text), schedules:[{label, rows:[[시간,내용]]}],
 *           evaluation(text), photos:[{fileId}], attachments:[...] }
 * (단위: HWPUNIT, 1pt = 100)
 */
var EduGen = (function () {
  // 원본 양식 header.xml 의 스타일 번호
  var P = {
    label: { id: 1, sp: 160 }, value: { id: 1, sp: 160 }, goal: { id: 19, sp: 180 }, place: { id: 2, sp: 140 },
    names: { id: 16, sp: 140 }, namesHead: { id: 14, sp: 160 },
    topicHead: { id: 17, sp: 160 }, topic: { id: 18, sp: 160, ind: 1000 },
    schedHead: { id: 21, sp: 140 }, cellC: { id: 1, sp: 160 }, cellL: { id: 14, sp: 160 },
    evalP: { id: 22, sp: 155, ind: 1500 }, plain: { id: 20, sp: 160 }, title: { id: 15, sp: 200 }
  };
  var C = { normal: 8, bold: 10, topic: 11, topicBold: 12, thBold: 15, td: 16, title: 14, footer: 9 };
  // 열 경계(가로 위치) — 원본 양식 그대로
  var X = { L: 0, A: 6580, B: 12698, C: 15696, D: 16830, E: 24812, F: 26392, G: 26958, H: 31387, R: 47336 };
  var PAD = 282, VPAD = 282;
  var PAGE_BREAK = 'CELL';   // 기존 보고서와 같은 쪽 나눔 설정

  var seq = 0, picList = [];
  function nid() { seq++; return 1300000000 + seq; }
  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function units(s) { var u = 0; for (var i = 0; i < s.length; i++) u += s.charCodeAt(i) > 0x2E7F ? 1000 : 550; return u; }
  function pOpen(st, pb) { return '<hp:p id="2147483648" paraPrIDRef="' + st.id + '" styleIDRef="0" pageBreak="' + (pb ? 1 : 0) + '" columnBreak="0" merged="0">'; }
  function para(st, text, width, cId, bId) {
    text = String(text == null ? '' : text);
    cId = cId == null ? C.normal : cId; bId = bId == null ? C.bold : bId;
    var out = '', plain = '';
    text.split(/(\*\*[^*]+\*\*)/).forEach(function (pt) {
      if (!pt) return;
      var b = /^\*\*[^*]+\*\*$/.test(pt), t = b ? pt.slice(2, -2) : pt;
      plain += t; out += '<hp:run charPrIDRef="' + (b ? bId : cId) + '"><hp:t>' + esc(t) + '</hp:t></hp:run>';
    });
    if (!out) out = '<hp:run charPrIDRef="' + cId + '"/>';
    var n = Math.max(1, Math.ceil(units(plain) * 1.06 / Math.max(2000, (width || 30000) - (st.ind || 0))));
    return { x: pOpen(st) + out + '</hp:p>', h: Math.round(n * 10 * st.sp) };
  }
  function join(a) { return { x: a.map(function (p) { return p.x; }).join(''), h: a.reduce(function (s, p) { return s + p.h; }, 0) }; }
  function textLines(t) { return String(t == null ? '' : t).replace(/\r/g, '').split('\n'); }
  function multi(text, width, st, cId) { return join(textLines(text).map(function (l) { return para(st, l, width, cId); })); }
  // "- " 로 시작하면 글머리(-) 줄, 아니면 일반 줄
  function bulletLines(text, width, plainSt, bulSt, cId, bId) {
    return join(textLines(text).map(function (ln) {
      var m = ln.match(/^\s*-\s+(.*)$/) || ln.match(/^\s*-$/);
      return m ? para(bulSt, m[1] || '', width, cId, bId) : para(plainSt, ln, width, cId, bId);
    }));
  }
  function cell(o) {
    return '<hp:tc header="0" hasMargin="0" protect="0" editable="0" dirty="0" borderFillIDRef="' + o.bf + '">' +
      '<hp:subList id="" textDirection="HORIZONTAL" lineWrap="BREAK" vertAlign="' + (o.valign || 'CENTER') + '" linkListIDRef="0" linkListNextIDRef="0" textWidth="' + (o.w - PAD) + '" textHeight="0" hasTextRef="0" hasNumRef="0">' +
      o.body + '</hp:subList><hp:cellAddr colAddr="' + o.c + '" rowAddr="' + o.r + '"/><hp:cellSpan colSpan="' + (o.cs || 1) + '" rowSpan="' + (o.rs || 1) + '"/>' +
      '<hp:cellSz width="' + o.w + '" height="' + Math.round(o.h) + '"/><hp:cellMargin left="141" right="141" top="141" bottom="141"/></hp:tc>';
  }
  function tblOpen(rows, cols, width, height, bf, z) {
    return '<hp:tbl id="' + nid() + '" zOrder="' + z + '" numberingType="TABLE" textWrap="TOP_AND_BOTTOM" textFlow="BOTH_SIDES" lock="0" dropcapstyle="None" pageBreak="' + PAGE_BREAK + '" repeatHeader="1" rowCnt="' + rows + '" colCnt="' + cols + '" cellSpacing="0" borderFillIDRef="' + bf + '" noAdjust="0">' +
      '<hp:sz width="' + width + '" widthRelTo="ABSOLUTE" height="' + Math.round(height) + '" heightRelTo="ABSOLUTE" protect="0"/>' +
      '<hp:pos treatAsChar="0" affectLSpacing="0" flowWithText="1" allowOverlap="0" holdAnchorAndSO="0" vertRelTo="PARA" horzRelTo="PARA" vertAlign="TOP" horzAlign="LEFT" vertOffset="0" horzOffset="0"/>' +
      '<hp:outMargin left="140" right="140" top="140" bottom="140"/><hp:inMargin left="138" right="138" top="138" bottom="138"/>';
  }

  // ── 날짜 ──
  var WD = ['일', '월', '화', '수', '목', '금', '토'];
  function fmtDate(iso) {
    if (!iso) return '';
    var p = String(iso).split('-').map(Number), d = new Date(p[0], p[1] - 1, p[2]);
    return p[0] + '. ' + p[1] + '. ' + p[2] + '.(' + WD[d.getDay()] + ')';
  }
  function datesText(d) { return (d.dates || []).filter(Boolean).map(fmtDate).join('\n'); }
  function num(v) { return Number(String(v == null ? '' : v).replace(/[^\d.]/g, '')) || 0; }
  function total(d) { return (d.attendees || []).reduce(function (s, a) { return s + num(a.count); }, 0); }

  // ── 그림 ──
  function picPara(img, fileId, maxW, maxH) {
    if (!img || !img.w) return null;
    var w = maxW, h = Math.round(maxW * img.h / img.w);
    if (h > maxH) { h = maxH; w = Math.round(maxH * img.w / img.h); }
    var f = picList.filter(function (q) { return q.fileId === fileId; })[0];
    var binId = f ? f.binId : 'image' + (picList.length + 1);
    if (!f) picList.push({ binId: binId, fileId: fileId });
    var dw = img.w * 75, dh = img.h * 75;
    return { h: h + 300, x: pOpen(P.cellC) + '<hp:run charPrIDRef="' + C.normal + '"><hp:pic id="' + nid() + '" zOrder="' + (20 + seq) + '" numberingType="PICTURE" textWrap="TOP_AND_BOTTOM" textFlow="BOTH_SIDES" lock="0" dropcapstyle="None" href="" groupLevel="0" instid="' + nid() + '" reverse="0">' +
      '<hp:offset x="0" y="0"/><hp:orgSz width="' + w + '" height="' + h + '"/><hp:curSz width="' + w + '" height="' + h + '"/><hp:flip horizontal="0" vertical="0"/>' +
      '<hp:rotationInfo angle="0" centerX="' + Math.round(w / 2) + '" centerY="' + Math.round(h / 2) + '" rotateimage="1"/>' +
      '<hp:renderingInfo><hc:transMatrix e1="1" e2="0" e3="0" e4="0" e5="1" e6="0"/><hc:scaMatrix e1="1" e2="0" e3="0" e4="0" e5="1" e6="0"/><hc:rotMatrix e1="1" e2="0" e3="0" e4="0" e5="1" e6="0"/></hp:renderingInfo>' +
      '<hp:imgRect><hc:pt0 x="0" y="0"/><hc:pt1 x="' + w + '" y="0"/><hc:pt2 x="' + w + '" y="' + h + '"/><hc:pt3 x="0" y="' + h + '"/></hp:imgRect>' +
      '<hp:imgClip left="0" right="' + dw + '" top="0" bottom="' + dh + '"/><hp:inMargin left="0" right="0" top="0" bottom="0"/><hp:imgDim dimwidth="' + dw + '" dimheight="' + dh + '"/>' +
      '<hc:img binaryItemIDRef="' + binId + '" bright="0" contrast="0" effect="REAL_PIC" alpha="0"/><hp:effects/>' +
      '<hp:sz width="' + w + '" widthRelTo="ABSOLUTE" height="' + h + '" heightRelTo="ABSOLUTE" protect="0"/>' +
      '<hp:pos treatAsChar="1" affectLSpacing="0" flowWithText="1" allowOverlap="0" holdAnchorAndSO="0" vertRelTo="PARA" horzRelTo="COLUMN" vertAlign="TOP" horzAlign="LEFT" vertOffset="0" horzOffset="0"/>' +
      '<hp:outMargin left="0" right="0" top="0" bottom="0"/><hp:shapeComment>그림입니다.</hp:shapeComment></hp:pic><hp:t/></hp:run></hp:p>' };
  }

  // ── 일정 표 (시간 | 내용) ──
  function schedTable(rows, width) {
    var w0 = Math.round(width * 0.39), w1 = width - w0, trs = '', H = 0;
    var list = [['시간', '내용']].concat((rows || []).filter(function (r) { return r && (String(r[0] || '').trim() || String(r[1] || '').trim()); }));
    list.forEach(function (r, ri) {
      var head = ri === 0;
      var a = multi(r[0], w0 - PAD, head ? P.cellC : P.cellL, head ? C.thBold : C.td);
      var b = multi(r[1], w1 - PAD, head ? P.cellC : P.cellL, head ? C.thBold : C.td);
      var h = Math.max(head ? 2400 : 2800, Math.max(a.h, b.h) + VPAD + 400); H += h;
      trs += '<hp:tr>' + cell({ r: ri, c: 0, w: w0, h: h, bf: head ? 14 : 3, body: a.x }) + cell({ r: ri, c: 1, w: w1, h: h, bf: head ? 14 : 3, body: b.x }) + '</hp:tr>';
    });
    return { x: pOpen(P.place) + '<hp:run charPrIDRef="' + C.normal + '">' + tblOpen(list.length, 2, width, H, 3, 3) + trs + '</hp:tbl><hp:t/></hp:run></hp:p>', h: H + 280 + 1400 };
  }

  // ── 큰 표: 칸을 가로 위치로 적어두고 마지막에 열 번호로 바꿈 ──
  function mainTable(d, images) {
    var rows = [];
    function add(h, cells) { rows.push({ h: h, cells: cells }); }
    function C_(x0, x1, bf, body, ex) { var o = { x0: x0, x1: x1, bf: bf, body: body }; for (var k in (ex || {})) o[k] = ex[k]; return o; }
    function lab(lines) { return join(lines.map(function (t) { return para(P.label, t, X.A - PAD, C.bold); })); }
    function rh() { var m = 0; for (var i = 0; i < arguments.length; i++) m = Math.max(m, arguments[i].h); return Math.max(2700, m + VPAD + 300); }
    var FW = X.R - X.A - PAD;

    // 0 제목 (꼬리말 「종로장애인복지관」 포함)
    add(3981, [C_(X.L, X.R, 15, pOpen(P.title) + '<hp:run charPrIDRef="' + C.title + '"><hp:ctrl><hp:footer id="1" applyPageType="BOTH"><hp:subList id="" textDirection="HORIZONTAL" lineWrap="BREAK" vertAlign="BOTTOM" linkListIDRef="0" linkListNextIDRef="0" textWidth="48192" textHeight="4252" hasTextRef="0" hasNumRef="0">' +
      '<hp:p id="0" paraPrIDRef="1" styleIDRef="0" pageBreak="0" columnBreak="0" merged="0"><hp:run charPrIDRef="' + C.footer + '"><hp:t>종로장애인복지관</hp:t></hp:run></hp:p></hp:subList></hp:footer></hp:ctrl>' +
      '<hp:t>' + esc(d.docTitle || '장애이해교육 결과보고서') + '</hp:t></hp:run></hp:p>')]);
    // 1 프로그램명
    var v = multi(d.programName, FW, P.value);
    add(rh(v), [C_(X.L, X.A, 8, lab(['프로그램명']).x), C_(X.A, X.R, 6, v.x)]);
    // 2 목표
    var g = multi(d.goal, FW, P.goal);
    add(rh(g), [C_(X.L, X.A, 8, lab(['목     표']).x), C_(X.A, X.R, 6, g.x)]);
    // 3 일시 / 장소
    var pl = multi(d.place, X.R - X.H - PAD, P.place);
    if (String(d.time || '').trim()) {
      var dt = multi(datesText(d), X.C - X.A - PAD, P.value), tm = multi(d.time, X.E - X.C - PAD, P.value);
      add(rh(dt, tm, pl), [C_(X.L, X.A, 8, lab(['일     시']).x), C_(X.A, X.C, 16, dt.x), C_(X.C, X.E, 19, tm.x),
        C_(X.E, X.H, 10, lab(['장     소']).x), C_(X.H, X.R, 6, pl.x)]);
    } else {
      // 시간이 없으면 날짜 칸을 하나로 합쳐 가운데에
      var dm = multi(datesText(d), X.E - X.A - PAD, P.value);
      add(rh(dm, pl), [C_(X.L, X.A, 8, lab(['일     시']).x), C_(X.A, X.E, 17, dm.x),
        C_(X.E, X.H, 10, lab(['장     소']).x), C_(X.H, X.R, 6, pl.x)]);
    }
    // 4 참석자
    var att = (d.attendees || []).filter(function (a) { return a.group || a.count || a.names; });
    if (!att.length) att = [{ group: '', count: '', names: '' }];
    var s = rows.length;
    add(2695, [C_(X.A, X.B, 10, lab(['구분']).x), C_(X.B, X.D, 10, lab(['인원']).x), C_(X.D, X.R, 11, para(P.namesHead, '이름', X.R - X.D - PAD, C.bold).x)]);
    att.forEach(function (a) {
      var gp = multi(a.group, X.B - X.A - PAD, P.value), ct = para(P.value, a.count === '' || a.count == null ? '' : num(a.count) + '명', X.D - X.B - PAD),
        nm = multi(a.names, X.R - X.D - PAD, P.names);
      add(Math.max(2263, Math.max(gp.h, nm.h) + VPAD + 300), [C_(X.A, X.B, 17, gp.x), C_(X.B, X.D, 17, ct.x), C_(X.D, X.R, 6, nm.x)]);
    });
    var hh = 0; for (var i = s; i < rows.length; i++) hh += rows[i].h;
    rows[s].cells.unshift(C_(X.L, X.A, 8, lab(['참 석 자', '(총' + total(d) + '명)']).x, { rs: rows.length - s, h: hh }));
    // 5 일정 및 내용
    var lw = X.F - X.A - PAD, rw = X.R - X.F - PAD;
    var left = join([{ x: pOpen(P.topicHead) + '<hp:run charPrIDRef="' + C.topic + '"><hp:t> 1. </hp:t></hp:run><hp:run charPrIDRef="' + C.topicBold + '"><hp:t>주요내용</hp:t></hp:run></hp:p>', h: 1600 },
      bulletLines(d.topics, lw, P.topicHead, P.topic, C.topic, C.topicBold)]);
    var rparts = [para(P.schedHead, '2. 일정', rw, C.topic)];
    (d.schedules || []).forEach(function (sc) {
      if (String(sc.label || '').trim()) rparts.push(para(P.schedHead, sc.label, rw, C.topic));
      rparts.push(schedTable(sc.rows, rw - 300));
    });
    var right = join(rparts);
    var hs = Math.max(left.h, right.h) + VPAD + 600;
    add(hs, [C_(X.L, X.A, 8, lab(['일    정', '및', '내    용']).x), C_(X.A, X.F, 13, left.x, { valign: 'TOP' }), C_(X.F, X.R, 12, right.x, { valign: 'TOP' })]);
    // 6 평가 — 한 줄이 한 문단(글머리 -), 빈 줄은 그대로 띄움
    var ev = join(textLines(d.evaluation).map(function (ln) {
      return ln.trim() ? para(P.evalP, ln.replace(/^\s*-\s+/, ''), FW) : para(P.plain, '', FW);
    }));
    add(Math.max(8000, ev.h + VPAD + 400), [C_(X.L, X.A, 8, lab(['평    가']).x), C_(X.A, X.R, 6, ev.x, { valign: 'TOP' })]);
    // 7 활동사진 — 2장씩
    var photos = (d.photos || []).filter(function (p) { return images[p.fileId]; });
    var ps = rows.length, nRows = Math.ceil(Math.max(2, photos.length) / 2);
    for (var k = 0; k < nRows; k++) {
      var last = k === nRows - 1;
      var a = photos[k * 2], b = photos[k * 2 + 1];
      var pa = a ? picPara(images[a.fileId], a.fileId, X.G - X.A - PAD - 200, 15000) : null;
      var pb = b ? picPara(images[b.fileId], b.fileId, X.R - X.G - PAD - 200, 15000) : null;
      add(Math.max(16490, Math.max(pa ? pa.h : 0, pb ? pb.h : 0) + VPAD + 500),
        [C_(X.A, X.G, last ? 18 : 17, (pa || para(P.cellL, '')).x), C_(X.G, X.R, last ? 7 : 6, (pb || para(P.cellL, '')).x)]);
    }
    var ph = 0; for (var q = ps; q < rows.length; q++) ph += rows[q].h;
    rows[ps].cells.unshift(C_(X.L, X.A, 9, lab(['활동사진']).x, { rs: rows.length - ps, h: ph }));

    // 열 번호 계산
    var set = {}; rows.forEach(function (r) { r.cells.forEach(function (c) { set[c.x0] = 1; set[c.x1] = 1; }); });
    var B = Object.keys(set).map(Number).sort(function (a, b) { return a - b; });
    var xml = '', H = 0;
    rows.forEach(function (r, ri) {
      H += r.h;
      xml += '<hp:tr>' + r.cells.map(function (c) {
        return cell({ r: ri, c: B.indexOf(c.x0), cs: B.indexOf(c.x1) - B.indexOf(c.x0), rs: c.rs || 1, w: c.x1 - c.x0, h: c.h || r.h, bf: c.bf, body: c.body, valign: c.valign });
      }).join('') + '</hp:tr>';
    });
    return tblOpen(rows.length, B.length - 1, X.R, H, 5, 0) + xml + '</hp:tbl>';
  }

  // 첨부 그림 여러 장을 한 줄에 cols장씩 (a.cols: 0=자동 · 1~3). 선 없는 표의 칸에 한 장씩 넣어요 (한글에서 줄이 넘치지 않게)
  function attCols(a) {
    var n = (a.images || []).length, c = Number(a.cols) || 0;
    if (c >= 1 && c <= 3) return c;
    return n <= 1 ? 1 : (n === 2 || n === 4) ? 2 : 3;
  }
  function picGrid(images, list, tw, cols, maxH1) {
    if (cols <= 1) return list.map(function (im) { return picPara(images[im.fileId], im.fileId, tw, maxH1); }).filter(Boolean);
    var ok = list.filter(function (im) { var g = images[im.fileId]; return g && g.w; });
    if (!ok.length) return [];
    var cw = Math.floor((tw - 600) / cols), pw = cw - PAD - 400, maxH = Math.round(pw * 1.45), trs = '', H = 0, nr = 0;
    for (var i = 0; i < ok.length; i += cols) {
      var ps = ok.slice(i, i + cols).map(function (im) { return picPara(images[im.fileId], im.fileId, pw, maxH); });
      var rh = Math.max.apply(null, ps.map(function (p) { return p ? p.h : 0; })) + VPAD + 300, cells = '';
      for (var c = 0; c < cols; c++) cells += cell({ r: nr, c: c, w: cw, h: rh, bf: 1, body: ps[c] ? ps[c].x : para(P.cellC, '', cw - PAD).x });
      trs += '<hp:tr>' + cells + '</hp:tr>'; H += rh; nr++;
    }
    return [{ x: pOpen(P.cellC) + '<hp:run charPrIDRef="' + C.normal + '">' + tblOpen(nr, cols, cw * cols, H, 1, 3) + trs + '</hp:tbl><hp:t/></hp:run></hp:p>', h: H + 1400 }];
  }
  // ── 첨부 자료 (계획서·결과보고서와 같은 방식, 새 쪽에서 시작) ──
  function attachments(d, images) {
    return (d.attachments || []).filter(function (a) { return a.title || a.text || (a.images || []).length; }).map(function (a) {
      var tw = X.R - PAD, parts = [];
      parts = picGrid(images, a.images || [], tw, attCols(a), 58000);
      if (String(a.text || '').trim()) parts.push(bulletLines(a.text, tw, P.plain, P.evalP));
      if (!parts.length) parts.push(para(P.plain, '', tw));
      var trs = '<hp:tr>' + cell({ r: 0, c: 0, w: X.R, h: 2700, bf: 10, body: para(P.label, a.title || '첨부', tw, C.bold).x }) + '</hp:tr>', H = 2700;
      parts.forEach(function (p, k) {
        var h = p.h + VPAD + 400; H += h;
        trs += '<hp:tr>' + cell({ r: k + 1, c: 0, w: X.R, h: h, bf: 17, valign: 'TOP', body: p.x }) + '</hp:tr>';
      });
      return pOpen(P.plain, true) + '<hp:run charPrIDRef="' + C.normal + '">' + tblOpen(parts.length + 1, 1, X.R, H, 5, 2) + trs + '</hp:tbl><hp:t/></hp:run></hp:p>';
    }).join('');
  }

  function buildSection(tpl, d, images) {
    seq = 0; picList = []; images = images || {};
    var i = tpl.indexOf('<hp:tbl '), depth = 0, re = /<hp:tbl |<\/hp:tbl>/g, m, end = -1;
    re.lastIndex = i;
    while ((m = re.exec(tpl))) { if (m[0] === '<hp:tbl ') depth++; else { depth--; if (depth === 0) { end = m.index + 9; break; } } }
    var out = tpl.slice(0, i) + mainTable(d, images) + tpl.slice(end);
    var att = attachments(d, images);
    if (att) out = out.replace(/<\/hs:sec>\s*$/, att + '</hs:sec>');
    return { xml: out, pics: picList.slice() };
  }

  function buildZip(zip, d, images) {
    images = images || {};
    return Promise.all([zip.file('Contents/section0.xml').async('string'), zip.file('Contents/content.hpf').async('string')]).then(function (r) {
      var res = buildSection(r[0], d, images);
      zip.file('Contents/section0.xml', res.xml);
      var items = '';
      res.pics.forEach(function (p) {
