<!--
  계획서 ↔ 결과보고 연결 (2026-11)
  - 결과보고 화면: 연결된 계획서를 왼쪽에 펼쳐 보기 (결과보고 입력칸은 오른쪽) / 연결 끊기 / 예전 결과보고는 계획서를 골라 연결
  - 계획서 화면: 이 계획서로 만든 결과보고 바로 열기, 없으면 「결과보고 만들기」
  - 왼쪽 목록: 결과보고를 계획서 밑에 묶어 보여줌. 결과보고에 「작성 완료」를 체크하면 계획서 안으로 접혀요
    (작성 중인 결과보고는 펼쳐진 채로, 결과보고가 없는 계획서는 「결과보고 아직 없음」)
  Code.gs의 doGet()에서 Index 뒤에 붙여요. Index.html의 함수(renderAll, renderList 등)를 감싸서 동작해요.
  연결 정보는 결과보고 데이터의 sourcePlanId, 시트의 「계획ID」 칸(8번째 칸)에,
  작성 완료는 결과보고 데이터의 done, 시트의 「작성완료」 칸(9번째 칸)에 들어가요.
-->
<style>
  #linkCard{padding:10px 16px}
  #linkCard .lk{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px}
  #linkCard .lk b{font-weight:700}
  #linkCard .lk .sp{flex:1}
  #linkCard select{width:auto;max-width:100%;min-width:220px}
  #linkCard .muted{color:var(--sub)}
  #list .lkm{font-size:11.5px;margin-top:2px}
  #list .lkm.ok{color:var(--main)}
  #list .lkm.no{color:var(--warn)}
  #list .lkm.ing{color:#9a5b12}
  #list .fold{display:inline-block;font-size:11.5px;color:var(--main);background:#eef3ef;border:1px solid #cfdcd3;border-radius:10px;padding:0 8px;margin-top:3px;cursor:pointer}
  #list .fold:hover{border-color:var(--main)}
  #linkCard .lk-done{display:flex;gap:6px;align-items:center;margin:8px 0 0;padding-top:8px;border-top:1px dashed var(--line);font-size:14px;color:var(--ink);cursor:pointer}
  #linkCard .lk-done input{width:auto;margin:0;transform:scale(1.2)}
  #linkCard .lk-done small{color:var(--sub)}
  /* 계획서 밑에 결과보고를 들여써서 선으로 이어 줌 */
  #list .item.lk-parent{margin-bottom:3px;border-left:3px solid var(--acc)}
  #list .item.lk-child{position:relative;margin-left:22px;margin-bottom:3px;border-left:3px solid var(--acc);background:#fdfbfc}
  #list .item.lk-child.on{background:var(--main2)}
  #list .item.lk-child.lk-last{margin-bottom:10px}
  #list .item.lk-child::before{content:'';position:absolute;left:-17px;top:-6px;height:calc(50% + 6px);width:12px;border-left:2px solid var(--acc);border-bottom:2px solid var(--acc);border-bottom-left-radius:6px}
  #list .item.lk-child:not(.lk-last)::after{content:'';position:absolute;left:-17px;top:50%;bottom:-6px;border-left:2px solid var(--acc)}
  #planSide{display:none}
  body.side .wrap{grid-template-columns:minmax(0,1fr) minmax(0,1fr);max-width:1800px}
  body.side aside{display:none}
  body.side #planSide{order:-1;display:block;position:sticky;top:64px;align-self:start;max-height:calc(100vh - 80px);overflow:auto;background:#ebe8e1;border:1px solid var(--line);border-radius:6px;padding:0 10px 10px}
  #planSide .sh{position:sticky;top:0;z-index:5;background:#ebe8e1;display:flex;align-items:center;gap:8px;padding:10px 0 8px;font-size:14px}
  #planSide .sh b{flex:1}
  #planSide .pg{padding:24px 20px;margin-bottom:10px;box-shadow:none;border:1px solid var(--line)}
  @media (max-width:900px){
    body.side .wrap{grid-template-columns:1fr}
    body.side #planSide{position:static;max-height:60vh}
    /* 연결된 계획서 칸은 목록 바로 밑에 붙어 있고, 그 아래 내용만 스크롤 */
    #linkCard{position:sticky;top:calc(var(--hh,0px) + var(--ah,0px));z-index:7;padding:8px 10px;overflow:visible;box-shadow:0 3px 8px rgba(0,0,0,.08)}
    #linkCard .lk{font-size:13px;gap:6px}
    #linkCard .lk b{flex:1 1 60%;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    #linkCard .lk .sp{display:none}
    #linkCard select{min-width:0;flex:1}
    #linkCard .lk-done{margin-top:6px;padding-top:6px;font-size:13px}
    #linkCard .lk-done small{display:none}
  }
</style>
<script>
(function(){
  var main = document.querySelector('main'), wrap = document.querySelector('.wrap');
  var card = el('div', {class:'card', id:'linkCard', style:'display:none'});
  main.insertBefore(card, main.firstChild);
  var side = el('section', {id:'planSide'});
  wrap.appendChild(side);
  var sideFor = null, planCache = {}, pendingMode = null, lastDoc = null, expanded = {};

  function isResType(t){ return t==='result' || t==='execResult'; }
  function planTypeLabel(t){ return t==='execResult' ? '실행계획서' : '활동계획서'; }   // 시트 「종류」 칸 이름
  function findSaved(id){ for (var i = 0; i < saved.length; i++) if (saved[i].id === id) return saved[i]; return null; }
  function resultsOf(planId){ return planId ? saved.filter(function(s){ return s.planId === planId; }) : []; }
  function nameOf(s){ return s.title || s.programName || '(제목 없음)'; }

  /* ── 연결 칸 (입력 화면 맨 위) ── */
  function renderLink(){
    card.innerHTML = '';
    if (!doc || doc.type==='edu'){ card.style.display = 'none'; return; }
    var row = el('div', {class:'lk'});
    if (isResType(doc.type)){
      if (doc.sourcePlanId){
        var p = findSaved(doc.sourcePlanId), open = sideFor === doc.sourcePlanId && document.body.classList.contains('side');
        row.appendChild(el('span', {text:'📎 연결된 계획서'}));
        row.appendChild(p ? el('b', {text: nameOf(p)}) : el('span', {class:'muted', text: saved.length ? '찾을 수 없어요 (지워졌을 수 있어요)' : '불러오는 중…'}));
        row.appendChild(el('span', {class:'sp'}));
        if (p) row.appendChild(el('button', {class:'sm' + (open ? '' : ' pri'), on:{click:function(){ open ? closeSide() : openSide(doc.sourcePlanId); }}, text: open ? '계획서 닫기' : '계획서 옆에 펼쳐 보기'}));
        row.appendChild(el('button', {class:'sm ghost del', on:{click:function(){
          if (!confirm('계획서와의 연결을 끊을까요? (두 보고서 내용은 그대로 남아요)')) return;
          delete doc.sourcePlanId; closeSide(); markDirty(); renderLink();
        }}, text:'연결 끊기'}));
      } else {
        var want = planTypeLabel(doc.type);
        var plans = saved.filter(function(s){ return s.type === want && s.id !== doc.id; });
        row.appendChild(el('span', {class:'muted', text:'📎 연결된 계획서가 없어요'}));
        row.appendChild(el('span', {class:'sp'}));
        if (plans.length){
          var sel = el('select');
          sel.appendChild(el('option', {value:'', text: want + ' 고르기…'}));
          plans.forEach(function(s){ sel.appendChild(el('option', {value:s.id, text: nameOf(s) + (s.date ? ' (' + s.date + ')' : '')})); });
          row.appendChild(sel);
          row.appendChild(el('button', {class:'sm', on:{click:function(){
            if (!sel.value) return toast('연결할 계획서를 골라주세요.');
            doc.sourcePlanId = sel.value; markDirty(); renderLink(); renderList(); toast('계획서와 연결했어요.');
          }}, text:'연결하기'}));
        } else row.appendChild(el('span', {class:'muted', text: saved.length ? '(연결할 ' + want + '가 아직 없어요)' : ''}));
      }
    } else {
      if (!doc.id){ card.style.display = 'none'; return; }
      var rs = resultsOf(doc.id);
      if (rs.length){
        row.appendChild(el('span', {text:'📎 이 계획서로 만든 결과보고'}));
        rs.forEach(function(s){ row.appendChild(el('button', {class:'sm', title:'열기', on:{click:function(){ openReport(s.id); }}, text: nameOf(s) + ' 열기'})); });
      } else {
        row.appendChild(el('span', {class:'muted', text:'📎 아직 결과보고가 없어요'}));
        row.appendChild(el('span', {class:'sp'}));
        row.appendChild(el('button', {class:'sm', on:{click:function(){ openReport(doc.id, 'toResult'); }}, text: doc.type==='exec' ? '→ 사업결과보고서 만들기' : '→ 활동결과보고 만들기'}));
      }
    }
    card.appendChild(row);
    if (isResType(doc.type)) card.appendChild(doneRow());
    card.style.display = '';
  }

  // 결과보고 「작성 완료」 체크
  function doneRow(){
    var cb = el('input', {type:'checkbox'}); cb.checked = !!doc.done;
    cb.addEventListener('change', function(){
      doc.done = cb.checked; markDirty();
      var s = doc.id && findSaved(doc.id); if (s){ s.done = doc.done; renderList(); }
      toast(doc.done ? '작성 완료로 표시했어요. 목록에서 계획서 안으로 접혀요.' : '다시 「작성 중」으로 바꿨어요.', 2500);
    });
    return el('label', {class:'lk-done'}, [cb, document.createTextNode(' ✅ 작성 완료'),
      el('small', {text: doc.done ? '— 목록에서 계획서 안으로 접혀 있어요' : '— 다 쓰면 체크하세요. 목록에서 계획서 안으로 접혀요'})]);
  }

  /* ── 계획서 옆에 펼쳐 보기 ── */
  function openSide(id){
    function show(p){
      ensureImages(neededImages(p), function(){
        if (!doc || doc.sourcePlanId !== id) return;      // 그 사이 다른 보고서로 넘어갔으면 그만
        sideFor = id; side.innerHTML = '';
        side.appendChild(el('div', {class:'sh'}, [el('b', {text:'📄 계획서 — 보기만 돼요'}),
          el('button', {class:'sm', title:'계획서를 열어서 고치기', on:{click:function(){ closeSide(); openReport(id); }}, text:'계획서 열기'}),
          el('button', {class:'sm', on:{click:closeSide}, text:'닫기 ✕'})]));
        var body = el('div'); body.innerHTML = isExec(p) ? previewExecHtml(p) : previewHtml(p);
        side.appendChild(body);
        document.body.classList.add('side'); side.scrollTop = 0; toast('', 1); renderLink();
      });
    }
    if (planCache[id]) return show(planCache[id]);
    toast('계획서 불러오는 중…', 20000);
    google.script.run.withSuccessHandler(function(p){ planCache[id] = p; show(p); }).withFailureHandler(fail).getReport(id);
  }
  function closeSide(){
    document.body.classList.remove('side'); side.innerHTML = ''; sideFor = null;
    if (doc) renderLink();
  }

  /* ── 왼쪽 목록에 연결 표시 ── */
  function decorateList(){
    var q = document.getElementById('q').value.trim();
    var arr = saved.filter(function(s){ return (!filterType || s.type===filterType) && (!q || (s.title+s.programName).indexOf(q) >= 0); });
    var items = document.querySelectorAll('#list .item');
    if (items.length !== arr.length) return;
    var byId = {}, kids = {};   // 목록에 보이는 항목들, 계획서별 결과보고
    arr.forEach(function(s, i){ byId[s.id] = items[i]; });
    arr.forEach(function(s, i){ if (s.planId && byId[s.planId]) (kids[s.planId] = kids[s.planId] || []).push({s: s, it: items[i]}); });
    arr.forEach(function(s, i){
      var it = items[i], m = it.querySelector('.m');
      function note(cls, text){ var n = el('div', {class:'lkm ' + cls, text:text}); m.parentNode.insertBefore(n, m.nextSibling); return n; }
      if (s.type==='활동계획서' || s.type==='실행계획서'){
        var rs = resultsOf(s.id), below = kids[s.id] || [];
        if (!rs.length) note('no', '결과보고 아직 없음');
        else {
          var ing = rs.filter(function(r){ return !r.done; }).length, many = rs.length > 1;
          var hasCur = below.some(function(k){ return doc && doc.id === k.s.id; });
          var folded = !ing && below.length && !expanded[s.id] && !hasCur;
          var txt = ing ? '✎ 결과보고 작성 중' + (many ? ' (' + (rs.length - ing) + '/' + rs.length + ' 완료)' : '') : '✓ 결과보고 완료' + (many ? ' (' + rs.length + '개)' : '');
          if (!ing && below.length && !hasCur){
            var chip = el('span', {class:'fold', title: folded ? '결과보고 펼쳐 보기' : '결과보고 접기', text: txt + (folded ? '  ▸ 펼치기' : '  ▾ 접기')});
            chip.addEventListener('click', function(e){ e.stopPropagation(); expanded[s.id] = folded; renderList(); });
            m.parentNode.insertBefore(el('div', {}, [chip]), m.nextSibling);
          } else note(ing ? 'ing' : 'ok', txt + (below.length < rs.length ? ' · 지금 목록엔 다 안 보여요' : ''));
          var acts = it.querySelector('.acts');
          acts.insertBefore(el('button', {class:'sm', on:{click:function(e){ e.stopPropagation(); openReport(rs[0].id); }}, text:'결과보고 열기'}), acts.firstChild);
        }
        // 결과보고를 계획서 바로 밑으로 옮겨 한 묶음으로 (모두 작성 완료면 접어 둠)
        if (below.length){
          if (!folded) it.classList.add('lk-parent');
          var at = it;
          below.forEach(function(k, j){
            k.it.classList.add('lk-child'); if (j === below.length - 1) k.it.classList.add('lk-last');
            if (folded) k.it.style.display = 'none';
            at.parentNode.insertBefore(k.it, at.nextSibling); at = k.it;
          });
        }
      } else if (s.planId){
        var st = s.done ? '✓ 작성 완료' : '✎ 작성 중';
        if (byId[s.planId]) note(s.done ? 'ok' : 'ing', st);
        else { var p = findSaved(s.planId); note(s.done ? 'ok' : 'ing', (p ? '↳ 계획서: ' + nameOf(p) : '↳ 계획서 연결 (지워짐)') + ' · ' + st); }
      }
    });
  }

  /* ── Index.html 함수 감싸기 ── */
  var _renderAll = renderAll, _renderList = renderList, _openReport = openReport, _updateListItem = updateListItem;
  renderAll = function(){
    if (doc !== lastDoc){
      if (pendingMode === 'copy' && !doc.id){ delete doc.sourcePlanId; delete doc.done; }   // 결과보고를 복사하면 연결·작성 완료는 따라가지 않음
      pendingMode = null; lastDoc = doc;
    }
    if (document.body.classList.contains('side') && (!doc || doc.sourcePlanId !== sideFor)) closeSide();
    _renderAll.apply(this, arguments);
    renderLink();
  };
  renderList = function(){ _renderList.apply(this, arguments); decorateList(); renderLink(); };
  openReport = function(id, mode){
    if (mode === 'toResult'){
      var rs = resultsOf(id);
      if (rs.length && !confirm('이 계획서로 만든 결과보고가 이미 있어요 (「' + nameOf(rs[0]) + '」).\n하나 더 만들까요?\n\n[취소]를 누르면 있는 결과보고를 열어요.')){ return _openReport(rs[0].id); }
    }
    pendingMode = mode || null;
    return _openReport(id, mode);
  };
  updateListItem = function(d, r){
    var s = findSaved(r.id); if (s){ s.planId = d.sourcePlanId || ''; s.done = !!d.done; }
    delete planCache[r.id];   // 계획서를 고쳐 자동 저장했으면 펼쳐 보기도 새로 불러오게
    return _updateListItem(d, r);
  };
  // 계획서를 고쳐 저장하면 펼쳐 보기 내용도 새로 불러오게
  var _save = save;
  save = function(cb){ if (doc && doc.id) delete planCache[doc.id]; return _save(cb); };

  renderLink();
})();
</script>
